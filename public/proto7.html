<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Proto7: Meta-Meta Pixel RPG</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg0: #0f1d2c;
			--bg1: #18344a;
			--bg2: #274f59;
			--panel: #112026;
			--ink: #e7f8d2;
			--accent: #ffd166;
			--hot: #ff6b6b;
			--cool: #70d6ff;
			--ok: #8ce99a;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
			background:
				radial-gradient(1200px 550px at 20% -10%, #2a4c63 0%, transparent 55%),
				radial-gradient(900px 500px at 100% 0%, #2d5f5c 0%, transparent 62%),
				linear-gradient(180deg, var(--bg1), var(--bg0));
			color: var(--ink);
			font-family: "VT323", monospace;
			overflow-x: hidden;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			background-image:
				linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
			background-size: 16px 16px;
			opacity: 0.32;
			mix-blend-mode: soft-light;
		}

		#app {
			width: min(1180px, 100% - 20px);
			margin: 14px auto 20px;
			display: grid;
			grid-template-columns: minmax(0, 3.3fr) minmax(260px, 1fr);
			gap: 12px;
			align-items: start;
		}

		#view {
			border: 3px solid #5bc0be;
			background: #08131b;
			box-shadow:
				0 0 0 3px #174a56 inset,
				0 18px 50px rgba(2, 10, 22, 0.55);
			image-rendering: pixelated;
			width: 100%;
			aspect-ratio: 5 / 3;
			display: block;
		}

		#hud {
			background: linear-gradient(180deg, rgba(9, 22, 31, 0.92), rgba(18, 35, 42, 0.9));
			border: 2px solid #30606d;
			box-shadow: 0 14px 34px rgba(0, 0, 0, 0.25);
			min-height: 540px;
			padding: 12px;
			display: grid;
			grid-template-rows: auto auto auto 1fr;
			gap: 10px;
		}

		.hud-title {
			font-family: "Press Start 2P", monospace;
			font-size: 12px;
			line-height: 1.6;
			letter-spacing: 0.8px;
			margin: 0;
			color: var(--accent);
			text-shadow: 1px 1px 0 #000;
		}

		.panel {
			border: 2px solid #3e7d8a;
			background: rgba(12, 28, 35, 0.7);
			padding: 8px;
			min-height: 84px;
		}

		.mono {
			white-space: pre-line;
			line-height: 1.1;
			font-size: clamp(19px, 1.25vw, 23px);
			color: #daf4e4;
		}

		#mutations {
			min-height: 92px;
			line-height: 1.15;
			font-size: 21px;
			color: #f5f0b2;
			overflow: auto;
			max-height: 210px;
		}

		#log {
			line-height: 1.1;
			font-size: 21px;
			color: #c2f7ff;
			overflow: auto;
			max-height: 310px;
		}

		#overlay {
			position: fixed;
			inset: 0;
			background: rgba(2, 8, 13, 0.74);
			backdrop-filter: blur(2px);
			display: grid;
			place-items: center;
			z-index: 30;
			transition: opacity 0.24s ease;
		}

		#overlay.hidden {
			opacity: 0;
			pointer-events: none;
		}

		#card {
			width: min(920px, calc(100% - 28px));
			border: 3px solid #68c7c1;
			background:
				linear-gradient(160deg, rgba(15, 35, 52, 0.95), rgba(22, 46, 52, 0.95));
			box-shadow:
				0 0 0 3px rgba(8, 25, 31, 0.8) inset,
				0 30px 60px rgba(0, 0, 0, 0.45);
			padding: 16px;
			animation: riseIn 0.45s ease;
		}

		@keyframes riseIn {
			from {
				transform: translateY(14px) scale(0.985);
				opacity: 0;
			}
			to {
				transform: translateY(0) scale(1);
				opacity: 1;
			}
		}

		#title {
			margin: 0 0 12px;
			font-family: "Press Start 2P", monospace;
			line-height: 1.5;
			color: #ffe599;
			font-size: clamp(15px, 2.4vw, 28px);
		}

		#overlay-text {
			margin: 0;
			color: #d4fcff;
			font-size: clamp(20px, 1.65vw, 27px);
			line-height: 1.1;
		}

		#draft {
			margin-top: 14px;
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 10px;
		}

		.draft-btn {
			border: 2px solid #58a3a7;
			background: linear-gradient(180deg, #193847, #0f2734);
			color: #fff7c4;
			text-align: left;
			font-family: "VT323", monospace;
			font-size: clamp(20px, 1.75vw, 26px);
			padding: 10px;
			cursor: pointer;
			transition: transform 0.12s ease, border-color 0.12s ease;
		}

		.draft-btn:hover,
		.draft-btn:focus-visible {
			border-color: #ffd166;
			transform: translateY(-2px);
			outline: none;
		}

		.draft-btn strong {
			display: block;
			font-size: 21px;
			margin-bottom: 4px;
			color: #bff7ff;
		}

		#touch {
			position: fixed;
			inset: auto 12px 12px 12px;
			display: none;
			justify-content: space-between;
			z-index: 25;
			pointer-events: none;
		}

		#touch .cluster,
		#touch .actions {
			display: grid;
			gap: 6px;
			pointer-events: auto;
		}

		#touch .cluster {
			grid-template-columns: repeat(3, 50px);
			grid-template-rows: repeat(3, 50px);
		}

		#touch button {
			border: 2px solid #67b0b3;
			background: rgba(18, 45, 58, 0.88);
			color: #f4f0c5;
			font-family: "Press Start 2P", monospace;
			font-size: 12px;
			border-radius: 8px;
			pointer-events: auto;
			touch-action: manipulation;
			user-select: none;
			width: 50px;
			height: 50px;
			display: grid;
			place-items: center;
		}

		#touch .actions {
			grid-template-columns: repeat(2, 62px);
			align-content: end;
		}

		#touch .actions button {
			width: 62px;
			height: 62px;
			font-size: 14px;
		}

		.pulse {
			animation: pulse 0.45s ease;
		}

		@keyframes pulse {
			0% {
				box-shadow: 0 0 0 0 rgba(255, 225, 128, 0.46);
			}
			100% {
				box-shadow: 0 0 0 20px rgba(255, 225, 128, 0);
			}
		}

		@media (max-width: 980px) {
			#app {
				grid-template-columns: 1fr;
			}

			#hud {
				min-height: 0;
			}
		}

		@media (hover: none), (pointer: coarse) {
			#touch {
				display: flex;
			}
		}

		@media (max-width: 760px) {
			#draft {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main id="app">
		<canvas id="view" width="800" height="480" aria-label="Meta recursive pixel RPG"></canvas>

		<aside id="hud">
			<h1 class="hud-title">PROTO7 // META-META PIXEL RPG</h1>

			<section class="panel">
				<div id="stats" class="mono"></div>
			</section>

			<section class="panel">
				<div id="mutations"></div>
			</section>

			<section class="panel">
				<div id="log"></div>
			</section>

			<section class="panel mono" id="controls">
				Move: WASD or Arrows
				Attack: Space
				Interact: E (portal/beacon)
				Reincarnate: R
				Draft: 1, 2, 3
			</section>
		</aside>
	</main>

	<section id="overlay">
		<div id="card">
			<h2 id="title">META // META // RECURSIVE RPG</h2>
			<p id="overlay-text"></p>
			<div id="draft"></div>
		</div>
	</section>

	<div id="touch" aria-hidden="true">
		<div class="cluster">
			<span></span>
			<button data-hold="true" data-key="ArrowUp">U</button>
			<span></span>
			<button data-hold="true" data-key="ArrowLeft">L</button>
			<span></span>
			<button data-hold="true" data-key="ArrowRight">R</button>
			<span></span>
			<button data-hold="true" data-key="ArrowDown">D</button>
			<span></span>
		</div>

		<div class="actions">
			<button data-key="Space">ATK</button>
			<button data-key="KeyE">USE</button>
			<button data-key="KeyR">REB</button>
		</div>
	</div>

	<script>
		(() => {
			const canvas = document.getElementById("view");
			const ctx = canvas.getContext("2d");
			ctx.imageSmoothingEnabled = false;

			const statsEl = document.getElementById("stats");
			const mutEl = document.getElementById("mutations");
			const logEl = document.getElementById("log");
			const overlayEl = document.getElementById("overlay");
			const overlayTextEl = document.getElementById("overlay-text");
			const draftEl = document.getElementById("draft");

			const TILE = 16;
			const WORLD_W = 96;
			const WORLD_H = 96;
			const SAVE_KEY = "proto7_meta_meta_recursive_rpg_v1";

			const TILE_COLORS = {
				0: "#48733d",
				1: "#1a3e5d",
				2: "#315635",
				3: "#59616b"
			};

			const MUTATIONS = [
				{
					id: "fractal-sprint",
					name: "Fractal Sprint",
					desc: "+30% movement speed.",
					apply(mods) {
						mods.speed *= 1.3;
					}
				},
				{
					id: "glass-cannon",
					name: "Glass Cannon",
					desc: "+55% damage, -30% max HP.",
					apply(mods) {
						mods.damage *= 1.55;
						mods.maxHp *= 0.7;
					}
				},
				{
					id: "bulwark-loop",
					name: "Bulwark Loop",
					desc: "+50% max HP, attack a little slower.",
					apply(mods) {
						mods.maxHp *= 1.5;
						mods.attackCooldown *= 1.12;
					}
				},
				{
					id: "orb-usury",
					name: "Orb Usury",
					desc: "Each orb gives +1 extra value.",
					apply(mods) {
						mods.orbValue += 1;
					}
				},
				{
					id: "echo-forge",
					name: "Echo Forge",
					desc: "Ancestor echoes hit harder.",
					apply(mods) {
						mods.echoDamage *= 1.65;
					}
				},
				{
					id: "vamp-thread",
					name: "Vampiric Thread",
					desc: "Heal 1 HP every enemy kill.",
					apply(mods) {
						mods.lifeOnKill += 1;
					}
				},
				{
					id: "pulse-kernel",
					name: "Pulse Kernel",
					desc: "Every 7s emit a damage pulse.",
					apply(mods) {
						mods.pulseDamage += 1.4;
						mods.pulseInterval = Math.min(mods.pulseInterval, 7);
					}
				},
				{
					id: "crit-jitter",
					name: "Crit Jitter",
					desc: "+18% crit chance, -12% HP.",
					apply(mods) {
						mods.critChance += 0.18;
						mods.maxHp *= 0.88;
					}
				}
			];

			const state = {
				save: loadSave(),
				phase: "draft",
				runSeed: 0,
				rngRun: null,
				player: null,
				stack: [],
				activeMutations: [],
				draftChoices: [],
				messages: [],
				keys: Object.create(null),
				justPressed: Object.create(null),
				camera: { x: 0, y: 0 },
				tick: 0,
				pulseClock: 0,
				maxDepthThisRun: 0,
				mods: null,
				screenShake: 0,
				hudFrame: 0
			};

			function clamp(value, min, max) {
				return Math.max(min, Math.min(max, value));
			}

			function randomName(rng) {
				const a = ["NOVA", "RIFT", "PIX", "ARC", "VEX", "LUMA", "KERN", "BOLT"];
				const b = ["RUN", "WARD", "GLYPH", "SPARK", "THREAD", "ECHO", "SEED", "BLADE"];
				return a[Math.floor(rng() * a.length)] + "-" + b[Math.floor(rng() * b.length)];
			}

			function hashString(text) {
				let h = 2166136261;
				for (let i = 0; i < text.length; i += 1) {
					h ^= text.charCodeAt(i);
					h = Math.imul(h, 16777619);
				}
				return h >>> 0;
			}

			function mulberry32(seed) {
				let t = seed >>> 0;
				return () => {
					t += 0x6d2b79f5;
					let r = Math.imul(t ^ (t >>> 15), t | 1);
					r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
					return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
				};
			}

			function distSq(ax, ay, bx, by) {
				const dx = ax - bx;
				const dy = ay - by;
				return dx * dx + dy * dy;
			}

			function loadSave() {
				const fallback = {
					totalRuns: 0,
					relics: 0,
					bestDepth: 0,
					ancestors: []
				};
				try {
					const raw = localStorage.getItem(SAVE_KEY);
					if (!raw) {
						return fallback;
					}
					const parsed = JSON.parse(raw);
					if (!parsed || typeof parsed !== "object") {
						return fallback;
					}
					return {
						totalRuns: Number.isFinite(parsed.totalRuns) ? parsed.totalRuns : 0,
						relics: Number.isFinite(parsed.relics) ? parsed.relics : 0,
						bestDepth: Number.isFinite(parsed.bestDepth) ? parsed.bestDepth : 0,
						ancestors: Array.isArray(parsed.ancestors) ? parsed.ancestors.slice(0, 24) : []
					};
				} catch {
					return fallback;
				}
			}

			function persistSave() {
				localStorage.setItem(SAVE_KEY, JSON.stringify(state.save));
			}

			function pushLog(text) {
				state.messages.unshift(text);
				state.messages = state.messages.slice(0, 9);
				logEl.textContent = state.messages.join("\n");
			}

			function makePlayer() {
				return {
					name: "",
					x: 0,
					y: 0,
					hp: 10,
					maxHp: 10,
					level: 1,
					xp: 0,
					kills: 0,
					orbs: 0,
					invuln: 0,
					attackTimer: 0,
					slashTimer: 0
				};
			}

			function computeMods() {
				const relics = state.save.relics || 0;
				const mods = {
					speed: 4.2,
					damage: 2.25,
					maxHp: 12 + Math.floor(relics / 2),
					attackCooldown: 0.34,
					orbValue: 1,
					echoDamage: 1,
					lifeOnKill: 0,
					pulseDamage: 0,
					pulseInterval: Number.POSITIVE_INFINITY,
					critChance: 0.06
				};

				for (const mutation of state.activeMutations) {
					mutation.apply(mods);
				}

				mods.speed = Math.max(2.1, mods.speed);
				mods.damage = Math.max(0.8, mods.damage);
				mods.maxHp = Math.max(5, mods.maxHp);
				mods.attackCooldown = clamp(mods.attackCooldown, 0.18, 0.9);
				mods.orbValue = Math.max(1, Math.floor(mods.orbValue));
				mods.critChance = clamp(mods.critChance, 0, 0.5);

				return mods;
			}

			function applyModsToPlayer(fullHeal) {
				state.mods = computeMods();
				const hpRatio = state.player.maxHp > 0 ? state.player.hp / state.player.maxHp : 1;
				state.player.maxHp = Math.round(state.mods.maxHp);

				if (fullHeal) {
					state.player.hp = state.player.maxHp;
				} else {
					state.player.hp = clamp(Math.round(state.player.maxHp * hpRatio), 1, state.player.maxHp);
				}
			}

			function noise2(x, y, seed) {
				const n = Math.sin((x * 127.1 + y * 311.7 + seed * 0.001) * 43758.5453123);
				return n - Math.floor(n);
			}

			function isSolid(world, x, y) {
				if (x < 1 || y < 1 || x >= WORLD_W - 1 || y >= WORLD_H - 1) {
					return true;
				}
				const tile = world.map[Math.floor(y)][Math.floor(x)];
				return tile === 1;
			}

			function randomWalkable(world, rng, avoidX, avoidY, minDist) {
				for (let attempt = 0; attempt < 2000; attempt += 1) {
					const x = 2 + Math.floor(rng() * (WORLD_W - 4));
					const y = 2 + Math.floor(rng() * (WORLD_H - 4));
					if (isSolid(world, x + 0.5, y + 0.5)) {
						continue;
					}
					if (avoidX !== undefined && avoidY !== undefined) {
						const d2 = distSq(x + 0.5, y + 0.5, avoidX, avoidY);
						if (d2 < (minDist || 8) * (minDist || 8)) {
							continue;
						}
					}
					return { x: x + 0.5, y: y + 0.5 };
				}
				return { x: WORLD_W / 2, y: WORLD_H / 2 };
			}

			function rollMutations(count, blocked) {
				const blockedSet = new Set(blocked || []);
				const pool = MUTATIONS.filter((m) => !blockedSet.has(m.id));
				const out = [];

				while (out.length < count && pool.length > 0) {
					const idx = Math.floor(state.rngRun() * pool.length);
					out.push(pool[idx]);
					pool.splice(idx, 1);
				}

				while (out.length < count) {
					out.push(MUTATIONS[Math.floor(state.rngRun() * MUTATIONS.length)]);
				}

				return out;
			}

			function generateWorld(depth, seed, mutation) {
				const rng = mulberry32((seed + depth * 0x9e3779b9) >>> 0);
				const map = [];

				for (let y = 0; y < WORLD_H; y += 1) {
					const row = new Uint8Array(WORLD_W);
					for (let x = 0; x < WORLD_W; x += 1) {
						if (x === 0 || y === 0 || x === WORLD_W - 1 || y === WORLD_H - 1) {
							row[x] = 1;
							continue;
						}
						const n1 = noise2(x * 0.063, y * 0.063, seed);
						const n2 = noise2((x + 32) * 0.14, (y - 24) * 0.14, seed + 71);
						const n = (n1 * 0.72) + (n2 * 0.28);
						let t = 0;
						if (n < 0.19) {
							t = 1;
						} else if (n < 0.28) {
							t = 3;
						} else if (n > 0.82) {
							t = 2;
						}
						row[x] = t;
					}
					map.push(row);
				}

				const spawn = { x: WORLD_W / 2 + 0.5, y: WORLD_H / 2 + 0.5 };
				for (let oy = -5; oy <= 5; oy += 1) {
					for (let ox = -5; ox <= 5; ox += 1) {
						const tx = Math.floor(spawn.x + ox);
						const ty = Math.floor(spawn.y + oy);
						if (tx > 1 && ty > 1 && tx < WORLD_W - 1 && ty < WORLD_H - 1) {
							map[ty][tx] = 0;
						}
					}
				}

				const world = {
					depth,
					seed,
					map,
					spawn,
					enemies: [],
					orbs: [],
					echoes: [],
					localKills: 0,
					killGoal: 4 + depth * 3,
					sigil: depth === 0,
					mutation: mutation || null,
					portal: null,
					beacon: null
				};

				world.portal = randomWalkable(world, rng, spawn.x, spawn.y, 22 + depth * 2);

				if (depth > 0) {
					world.beacon = {
						x: spawn.x - 3,
						y: spawn.y + 1
					};
				}

				const enemyCount = 16 + depth * 6;
				for (let i = 0; i < enemyCount; i += 1) {
					const pos = randomWalkable(world, rng, spawn.x, spawn.y, 10);
					world.enemies.push({
						x: pos.x,
						y: pos.y,
						hp: 4 + depth * 1.5,
						speed: 1.8 + rng() * 0.8 + depth * 0.05,
						hit: 1 + depth * 0.2,
						cool: rng() * 0.9,
						wanderX: rng() * 2 - 1,
						wanderY: rng() * 2 - 1,
						wanderT: 0.8 + rng() * 1.8
					});
				}

				const orbCount = 26 + depth * 5;
				for (let i = 0; i < orbCount; i += 1) {
					const pos = randomWalkable(world, rng, spawn.x, spawn.y, 8);
					world.orbs.push({ x: pos.x, y: pos.y });
				}

				return world;
			}

			function currentWorld() {
				return state.stack[state.stack.length - 1];
			}

			function spawnEchoes(world) {
				world.echoes = [];
				const ancestors = state.save.ancestors;
				if (!ancestors.length) {
					return;
				}

				const count = Math.min(2 + Math.floor(state.save.relics / 6), ancestors.length, 5);
				for (let i = 0; i < count; i += 1) {
					const anc = ancestors[ancestors.length - 1 - i];
					world.echoes.push({
						x: world.spawn.x + (i - 2) * 0.6,
						y: world.spawn.y + ((i % 2) - 0.5) * 0.9,
						cool: 0,
						power: 0.7 + (anc.level || 1) * 0.17,
						color: anc.color || "#8cc5ff",
						anchor: i
					});
				}
			}

			function renderDraftChoices() {
				draftEl.innerHTML = "";
				state.draftChoices.forEach((mut, idx) => {
					const b = document.createElement("button");
					b.className = "draft-btn";
					b.innerHTML = `<strong>${idx + 1}. ${mut.name}</strong>${mut.desc}`;
					b.addEventListener("click", () => chooseDraft(idx));
					draftEl.appendChild(b);
				});
			}

			function startDraft() {
				state.phase = "draft";
				state.runSeed = ((Date.now() >>> 0) ^ Math.imul(state.save.totalRuns + 11, 2654435761)) >>> 0;
				state.rngRun = mulberry32(state.runSeed);
				state.stack = [];
				state.activeMutations = [];
				state.messages = [];
				state.maxDepthThisRun = 0;
				state.pulseClock = 0;
				state.player = makePlayer();
				state.player.name = randomName(state.rngRun);
				state.draftChoices = rollMutations(3, []);

				overlayEl.classList.remove("hidden");
				overlayTextEl.textContent =
					"Draft your first Axiom. Then recurse through nested worlds, recruit echoes of your own past runs, and rewrite each timeline forever.";
				renderDraftChoices();

				pushLog("Run Seed " + state.runSeed);
			}

			function chooseDraft(index) {
				if (state.phase !== "draft") {
					return;
				}
				const mutation = state.draftChoices[index];
				state.activeMutations = [mutation];
				state.player = makePlayer();
				state.player.name = randomName(state.rngRun);
				applyModsToPlayer(true);

				const root = generateWorld(0, state.runSeed, null);
				state.stack = [root];
				state.player.x = root.spawn.x;
				state.player.y = root.spawn.y;
				spawnEchoes(root);
				state.phase = "play";

				overlayEl.classList.add("hidden");
				pushLog("Axiom chosen: " + mutation.name);
				pushLog("Collect orbs, defeat foes, and enter the Rift Portal.");
			}

			function commitAncestor() {
				const mNames = state.activeMutations.map((m) => m.name).join(" + ");
				state.save.ancestors.push({
					name: state.player.name,
					level: state.player.level,
					kills: state.player.kills,
					orbs: state.player.orbs,
					signature: mNames,
					color: ["#8cc5ff", "#ffd27f", "#96f2d7", "#ffadad"][Math.floor(Math.random() * 4)]
				});
				if (state.save.ancestors.length > 24) {
					state.save.ancestors.shift();
				}

				state.save.totalRuns += 1;
				state.save.bestDepth = Math.max(state.save.bestDepth, state.maxDepthThisRun);
				persistSave();
			}

			function reincarnate(reason) {
				if (state.phase !== "play") {
					return;
				}
				pushLog(reason);
				commitAncestor();
				startDraft();
			}

			function near(a, b, threshold) {
				return distSq(a.x, a.y, b.x, b.y) <= threshold * threshold;
			}

			function descend() {
				const world = currentWorld();
				const need = 6 + world.depth * 3;
				if (state.player.orbs < need) {
					pushLog("Need " + need + " orbs to descend.");
					return;
				}

				const blocked = state.activeMutations.map((m) => m.id);
				const nextMutation = rollMutations(1, blocked)[0];
				const nextSeed = hashString(world.seed + "|" + world.depth + "|" + state.player.kills + "|" + state.player.orbs);
				const child = generateWorld(world.depth + 1, nextSeed, nextMutation);

				state.player.orbs -= need;
				state.activeMutations.push(nextMutation);
				state.stack.push(child);
				state.maxDepthThisRun = Math.max(state.maxDepthThisRun, child.depth);

				applyModsToPlayer(false);
				state.player.x = child.spawn.x;
				state.player.y = child.spawn.y;
				spawnEchoes(child);

				pushLog("Descended to depth " + child.depth + ". Rule injected: " + nextMutation.name);
			}

			function ascend() {
				const world = currentWorld();
				if (world.depth === 0) {
					return;
				}
				if (!world.sigil) {
					const remaining = Math.max(0, world.killGoal - world.localKills);
					pushLog("Beacon locked. Defeat " + remaining + " more enemies.");
					return;
				}

				state.stack.pop();
				const removed = state.activeMutations.pop();
				const parent = currentWorld();
				state.player.x = parent.portal.x + 1.5;
				state.player.y = parent.portal.y;
				state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3);

				state.save.relics += 1;
				state.save.bestDepth = Math.max(state.save.bestDepth, world.depth);
				persistSave();

				applyModsToPlayer(false);
				pushLog("Reality collapsed upward. +1 relic.");
				if (removed) {
					pushLog("Rule removed: " + removed.name);
				}
			}

			function interact() {
				const world = currentWorld();
				const playerPoint = { x: state.player.x, y: state.player.y };

				if (near(playerPoint, world.portal, 1.2)) {
					descend();
					return;
				}

				if (world.beacon && near(playerPoint, world.beacon, 1.2)) {
					ascend();
					return;
				}

				pushLog("Nothing to interact with here.");
			}

			function gainXp(amount) {
				state.player.xp += amount;
				while (state.player.xp >= state.player.level * 12) {
					state.player.xp -= state.player.level * 12;
					state.player.level += 1;
					state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3);
					pushLog("Level up. You are now level " + state.player.level + ".");
				}
			}

			function killEnemy(world, idx) {
				const enemy = world.enemies[idx];
				state.player.kills += 1;
				gainXp(4);
				world.localKills += 1;

				if (state.mods.lifeOnKill > 0) {
					state.player.hp = Math.min(state.player.maxHp, state.player.hp + state.mods.lifeOnKill);
				}

				if (Math.random() < 0.8) {
					world.orbs.push({ x: enemy.x + (Math.random() - 0.5) * 0.8, y: enemy.y + (Math.random() - 0.5) * 0.8 });
				}

				world.enemies.splice(idx, 1);

				if (!world.sigil && world.localKills >= world.killGoal) {
					world.sigil = true;
					pushLog("Sigil formed. Beacon can now return to parent reality.");
				}
			}

			function attack() {
				if (state.player.attackTimer > 0) {
					return;
				}
				const world = currentWorld();
				state.player.attackTimer = state.mods.attackCooldown;
				state.player.slashTimer = 0.12;
				canvas.classList.remove("pulse");
				canvas.offsetHeight;
				canvas.classList.add("pulse");

				for (let i = world.enemies.length - 1; i >= 0; i -= 1) {
					const e = world.enemies[i];
					const d2 = distSq(state.player.x, state.player.y, e.x, e.y);
					if (d2 > 1.8 * 1.8) {
						continue;
					}
					let dmg = state.mods.damage + state.player.level * 0.16;
					if (Math.random() < state.mods.critChance) {
						dmg *= 1.7;
					}
					e.hp -= dmg;
					if (e.hp <= 0) {
						killEnemy(world, i);
					}
				}
			}

			function pulseBurst() {
				if (!(state.mods.pulseDamage > 0)) {
					return;
				}
				const world = currentWorld();
				let hit = 0;
				for (let i = world.enemies.length - 1; i >= 0; i -= 1) {
					const e = world.enemies[i];
					if (distSq(state.player.x, state.player.y, e.x, e.y) <= 4.5 * 4.5) {
						e.hp -= state.mods.pulseDamage;
						hit += 1;
						if (e.hp <= 0) {
							killEnemy(world, i);
						}
					}
				}
				if (hit > 0) {
					pushLog("Pulse Kernel discharged into " + hit + " foes.");
				}
			}

			function moveWithCollisions(entity, vx, vy, speed, dt, world) {
				const nx = entity.x + vx * speed * dt;
				const ny = entity.y + vy * speed * dt;

				if (!isSolid(world, nx, entity.y)) {
					entity.x = nx;
				}
				if (!isSolid(world, entity.x, ny)) {
					entity.y = ny;
				}

				entity.x = clamp(entity.x, 1.1, WORLD_W - 1.1);
				entity.y = clamp(entity.y, 1.1, WORLD_H - 1.1);
			}

			function updatePlayer(dt, world) {
				const up = state.keys.ArrowUp || state.keys.KeyW;
				const down = state.keys.ArrowDown || state.keys.KeyS;
				const left = state.keys.ArrowLeft || state.keys.KeyA;
				const right = state.keys.ArrowRight || state.keys.KeyD;

				let vx = (right ? 1 : 0) - (left ? 1 : 0);
				let vy = (down ? 1 : 0) - (up ? 1 : 0);
				const mag = Math.hypot(vx, vy) || 1;
				vx /= mag;
				vy /= mag;

				const under = world.map[Math.floor(state.player.y)][Math.floor(state.player.x)];
				let speed = state.mods.speed;
				if (under === 2) {
					speed *= 0.8;
				}

				moveWithCollisions(state.player, vx, vy, speed, dt, world);

				state.player.attackTimer = Math.max(0, state.player.attackTimer - dt);
				state.player.slashTimer = Math.max(0, state.player.slashTimer - dt);
				state.player.invuln = Math.max(0, state.player.invuln - dt);

				if (consumePress("Space")) {
					attack();
				}
				if (consumePress("KeyE")) {
					interact();
				}
				if (consumePress("KeyR")) {
					reincarnate("You manually reincarnated.");
				}
			}

			function nearestEnemy(world, x, y, maxDistSq) {
				let best = null;
				let bestD2 = maxDistSq;
				for (const e of world.enemies) {
					const d2 = distSq(x, y, e.x, e.y);
					if (d2 < bestD2) {
						bestD2 = d2;
						best = e;
					}
				}
				return best;
			}

			function updateEchoes(dt, world) {
				for (const echo of world.echoes) {
					echo.cool = Math.max(0, echo.cool - dt);
					const target = nearestEnemy(world, echo.x, echo.y, 8 * 8);
					if (target) {
						const dx = target.x - echo.x;
						const dy = target.y - echo.y;
						const m = Math.hypot(dx, dy) || 1;
						moveWithCollisions(echo, dx / m, dy / m, 2.6, dt, world);
						if (distSq(echo.x, echo.y, target.x, target.y) < 1.2 * 1.2 && echo.cool <= 0) {
							target.hp -= echo.power * state.mods.echoDamage;
							echo.cool = 0.64;
							if (target.hp <= 0) {
								const index = world.enemies.indexOf(target);
								if (index >= 0) {
									killEnemy(world, index);
								}
							}
						}
					} else {
						const desiredX = state.player.x + Math.sin(state.tick * 1.8 + echo.anchor) * 1.35;
						const desiredY = state.player.y + Math.cos(state.tick * 1.25 + echo.anchor) * 1.1;
						const dx = desiredX - echo.x;
						const dy = desiredY - echo.y;
						const m = Math.hypot(dx, dy) || 1;
						moveWithCollisions(echo, dx / m, dy / m, 2.1, dt, world);
					}
				}
			}

			function hitPlayer(amount) {
				if (state.player.invuln > 0) {
					return;
				}
				state.player.hp -= amount;
				state.player.invuln = 0.72;
				state.screenShake = Math.min(8, state.screenShake + 2.2);
			}

			function updateEnemies(dt, world) {
				for (const enemy of world.enemies) {
					enemy.cool = Math.max(0, enemy.cool - dt);
					enemy.wanderT -= dt;
					if (enemy.wanderT <= 0) {
						enemy.wanderX = Math.random() * 2 - 1;
						enemy.wanderY = Math.random() * 2 - 1;
						enemy.wanderT = 0.55 + Math.random() * 1.5;
					}

					let vx = enemy.wanderX;
					let vy = enemy.wanderY;
					const d2 = distSq(enemy.x, enemy.y, state.player.x, state.player.y);
					if (d2 < 11 * 11) {
						vx = state.player.x - enemy.x;
						vy = state.player.y - enemy.y;
					}

					const m = Math.hypot(vx, vy) || 1;
					moveWithCollisions(enemy, vx / m, vy / m, enemy.speed, dt, world);

					if (distSq(enemy.x, enemy.y, state.player.x, state.player.y) < 0.72 * 0.72 && enemy.cool <= 0) {
						enemy.cool = 0.9;
						hitPlayer(enemy.hit);
					}
				}
			}

			function collectOrbs(world) {
				for (let i = world.orbs.length - 1; i >= 0; i -= 1) {
					const orb = world.orbs[i];
					if (distSq(state.player.x, state.player.y, orb.x, orb.y) < 0.62 * 0.62) {
						world.orbs.splice(i, 1);
						state.player.orbs += state.mods.orbValue;
						gainXp(1);
					}
				}
			}

			function consumePress(code) {
				if (!state.justPressed[code]) {
					return false;
				}
				delete state.justPressed[code];
				return true;
			}

			function updateHud(world) {
				const depth = world ? world.depth : 0;
				const objective = !world
					? "Choose a starting axiom"
					: depth === 0
						? "Objective: gather orbs and press E at Portal"
						: world.sigil
							? "Objective: return via Beacon (E)"
							: "Objective: defeat " + Math.max(0, world.killGoal - world.localKills) + " foes for Sigil";

				const hp = Math.max(0, state.player.hp).toFixed(0);
				const hpMax = state.player.maxHp.toFixed(0);

				statsEl.textContent =
					"Hero: " + state.player.name + "\n" +
					"Run: " + (state.save.totalRuns + (state.phase === "play" ? 1 : 0)) + "\n" +
					"Depth: " + depth + "\n" +
					"HP: " + hp + " / " + hpMax + "\n" +
					"Lvl: " + state.player.level + "   XP: " + state.player.xp + "\n" +
					"Kills: " + state.player.kills + "\n" +
					"Orbs: " + state.player.orbs + "\n" +
					"Relics: " + state.save.relics + "\n" +
					"Best Depth: " + state.save.bestDepth + "\n" +
					objective;

				mutEl.textContent =
					"Active Axioms\n" +
					state.activeMutations.map((m, i) => (i + 1) + ". " + m.name + " - " + m.desc).join("\n");
			}

			function drawTile(x, y, color) {
				ctx.fillStyle = color;
				ctx.fillRect(x, y, TILE, TILE);
			}

			function draw(world) {
				const shakeX = (Math.random() - 0.5) * state.screenShake;
				const shakeY = (Math.random() - 0.5) * state.screenShake;
				state.screenShake = Math.max(0, state.screenShake - 0.18);

				const viewTilesX = Math.ceil(canvas.width / TILE);
				const viewTilesY = Math.ceil(canvas.height / TILE);
				const camX = clamp(state.player.x - viewTilesX / 2, 0, WORLD_W - viewTilesX);
				const camY = clamp(state.player.y - viewTilesY / 2, 0, WORLD_H - viewTilesY);
				state.camera.x = camX;
				state.camera.y = camY;

				ctx.save();
				ctx.translate(Math.round(shakeX), Math.round(shakeY));
				ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);

				const startX = Math.floor(camX);
				const startY = Math.floor(camY);
				const endX = startX + viewTilesX + 1;
				const endY = startY + viewTilesY + 1;

				for (let y = startY; y < endY; y += 1) {
					for (let x = startX; x < endX; x += 1) {
						const tile = world.map[y] && world.map[y][x] !== undefined ? world.map[y][x] : 1;
						const sx = Math.floor((x - camX) * TILE);
						const sy = Math.floor((y - camY) * TILE);
						let c = TILE_COLORS[tile] || "#000";
						if (tile === 1 && ((x + y + Math.floor(state.tick * 3)) % 3 === 0)) {
							c = "#25557a";
						}
						drawTile(sx, sy, c);
					}
				}

				const p = world.portal;
				const portalX = Math.floor((p.x - camX) * TILE);
				const portalY = Math.floor((p.y - camY) * TILE);
				ctx.fillStyle = "#ff9f1c";
				ctx.fillRect(portalX - 6, portalY - 6, 12, 12);
				ctx.fillStyle = "#ffe8a3";
				const pulse = 4 + Math.sin(state.tick * 5) * 2;
				ctx.fillRect(portalX - pulse / 2, portalY - pulse / 2, pulse, pulse);

				if (world.beacon) {
					const b = world.beacon;
					const bx = Math.floor((b.x - camX) * TILE);
					const by = Math.floor((b.y - camY) * TILE);
					ctx.fillStyle = world.sigil ? "#8ce99a" : "#80858f";
					ctx.fillRect(bx - 6, by - 6, 12, 12);
					ctx.fillStyle = "#d4fff0";
					ctx.fillRect(bx - 2, by - 2, 4, 4);
				}

				for (const orb of world.orbs) {
					const ox = Math.floor((orb.x - camX) * TILE);
					const oy = Math.floor((orb.y - camY) * TILE);
					ctx.fillStyle = "#ffe066";
					ctx.fillRect(ox - 3, oy - 3, 6, 6);
					ctx.fillStyle = "#fff6bf";
					ctx.fillRect(ox - 1, oy - 1, 2, 2);
				}

				for (const enemy of world.enemies) {
					const ex = Math.floor((enemy.x - camX) * TILE);
					const ey = Math.floor((enemy.y - camY) * TILE);
					ctx.fillStyle = "#e63946";
					ctx.fillRect(ex - 6, ey - 6, 12, 12);
					ctx.fillStyle = "#ffe3e3";
					ctx.fillRect(ex - 2, ey - 2, 4, 2);
				}

				for (const echo of world.echoes) {
					const ex = Math.floor((echo.x - camX) * TILE);
					const ey = Math.floor((echo.y - camY) * TILE);
					ctx.fillStyle = echo.color;
					ctx.globalAlpha = 0.7;
					ctx.fillRect(ex - 5, ey - 5, 10, 10);
					ctx.globalAlpha = 1;
				}

				const px = Math.floor((state.player.x - camX) * TILE);
				const py = Math.floor((state.player.y - camY) * TILE);
				const blinking = state.player.invuln > 0 && Math.floor(state.tick * 16) % 2 === 0;
				if (!blinking) {
					ctx.fillStyle = "#70d6ff";
					ctx.fillRect(px - 6, py - 6, 12, 12);
					ctx.fillStyle = "#f1fdff";
					ctx.fillRect(px - 2, py - 2, 4, 2);
				}

				if (state.player.slashTimer > 0) {
					ctx.fillStyle = "rgba(255, 240, 175, 0.7)";
					ctx.fillRect(px - 15, py - 15, 30, 30);
				}

				drawMiniMap(world);
				ctx.restore();
			}

			function drawMiniMap(world) {
				const w = 120;
				const h = 120;
				const x = canvas.width - w - 8;
				const y = 8;
				ctx.fillStyle = "rgba(2, 10, 18, 0.72)";
				ctx.fillRect(x, y, w, h);
				ctx.strokeStyle = "#78c4c4";
				ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

				const sx = w / WORLD_W;
				const sy = h / WORLD_H;
				for (let i = 0; i < world.enemies.length; i += 1) {
					const e = world.enemies[i];
					ctx.fillStyle = "#f25f5c";
					ctx.fillRect(x + e.x * sx, y + e.y * sy, 1.6, 1.6);
				}

				for (let i = 0; i < world.orbs.length; i += 1) {
					const o = world.orbs[i];
					ctx.fillStyle = "#ffe066";
					ctx.fillRect(x + o.x * sx, y + o.y * sy, 1.2, 1.2);
				}

				ctx.fillStyle = "#ffa94d";
				ctx.fillRect(x + world.portal.x * sx - 1.5, y + world.portal.y * sy - 1.5, 3, 3);

				if (world.beacon) {
					ctx.fillStyle = world.sigil ? "#8ce99a" : "#747d8c";
					ctx.fillRect(x + world.beacon.x * sx - 1.5, y + world.beacon.y * sy - 1.5, 3, 3);
				}

				ctx.fillStyle = "#70d6ff";
				ctx.fillRect(x + state.player.x * sx - 2, y + state.player.y * sy - 2, 4, 4);
			}

			function update(dt) {
				if (state.phase === "draft") {
					if (consumePress("Digit1")) {
						chooseDraft(0);
					}
					if (consumePress("Digit2")) {
						chooseDraft(1);
					}
					if (consumePress("Digit3")) {
						chooseDraft(2);
					}
					updateHud(null);
					return;
				}

				const world = currentWorld();
				if (!world) {
					return;
				}

				state.tick += dt;
				state.pulseClock += dt;

				updatePlayer(dt, world);
				updateEchoes(dt, world);
				updateEnemies(dt, world);
				collectOrbs(world);

				if (state.mods.pulseDamage > 0 && state.pulseClock >= state.mods.pulseInterval) {
					state.pulseClock = 0;
					pulseBurst();
				}

				if (state.player.hp <= 0) {
					reincarnate("You fell. Your run became an ancestor echo.");
					return;
				}

				state.hudFrame += 1;
				if (state.hudFrame % 4 === 0) {
					updateHud(world);
				}
			}

			function loop(now) {
				if (!loop.last) {
					loop.last = now;
				}
				const dt = Math.min(0.05, (now - loop.last) / 1000);
				loop.last = now;

				update(dt);
				const world = currentWorld();
				if (world && state.phase === "play") {
					draw(world);
				}

				state.justPressed = Object.create(null);
				requestAnimationFrame(loop);
			}

			function onKeyDown(ev) {
				if (!state.keys[ev.code]) {
					state.justPressed[ev.code] = true;
				}
				state.keys[ev.code] = true;

				if (ev.code.startsWith("Arrow") || ev.code === "Space") {
					ev.preventDefault();
				}
			}

			function onKeyUp(ev) {
				state.keys[ev.code] = false;
			}

			function wireTouch() {
				const buttons = document.querySelectorAll("#touch button");
				for (const btn of buttons) {
					const key = btn.getAttribute("data-key");
					const hold = btn.getAttribute("data-hold") === "true";

					const down = (ev) => {
						ev.preventDefault();
						state.justPressed[key] = true;
						if (hold) {
							state.keys[key] = true;
						}
					};

					const up = (ev) => {
						ev.preventDefault();
						if (hold) {
							state.keys[key] = false;
						}
					};

					btn.addEventListener("pointerdown", down);
					btn.addEventListener("pointerup", up);
					btn.addEventListener("pointercancel", up);
					btn.addEventListener("pointerleave", up);
				}
			}

			window.addEventListener("keydown", onKeyDown, { passive: false });
			window.addEventListener("keyup", onKeyUp);
			wireTouch();
			startDraft();
			requestAnimationFrame(loop);
		})();
	</script>
</body>
</html>
