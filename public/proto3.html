<!DOCTYPE html>
<html>
<body>
<div id="canvas">Recursive Self-Consumption Initiated...</div>
<script>
  async function eatSelf() {
    // 1. Get own body
    let me = document.documentElement.outerHTML;

    // 2. The recursive "Step": Corrupt the string based on its own length
    // In a real version, we'd use AudioContext to 'bitcrush' this based on frequency
    let entropy = Math.floor(Math.random() * me.length);
    
    // We replace a chunk of valid code with a recursive visual artifact
    // This is the "glitch" recursion
    let corruption = `<span style="color:rgb(${entropy%255},0,0); font-size:${(entropy%20)+10}px">ERROR_${entropy}</span>`;
    
    let newMe = me.substring(0, entropy) + corruption + me.substring(entropy + 10);

    // 3. The Recursion: The page rewrites the document stream
    // This is rare because it usually kills the script execution context.
    // We use a specific trick: putting the result in a container, not wiping the script tag.
    
    // Safety break: Stop if we are too big or broken
    if (me.length > 50000) return; 

    // Visual Render of the corruption
    document.body.innerHTML = newMe;
    
    // 4. Force browser paint then recurse
    requestAnimationFrame(eatSelf);
  }

  // Trigger the end
  setTimeout(eatSelf, 1000);
</script>
</body>
</html>
