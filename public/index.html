0023,"tags":[["d","about"],["title","About"],["t","ronishbhatt.com"],["t","section"],["order","0"],["alt","About — a block of ronishbhatt.com"]],"content":"I build things to see how they work underneath. Right now that means mechanistic interpretability of small language models: reading a transformer's residual stream with the model's own weights, and watching how it keeps, revises and reuses what it has read.\n\nI also run my own infrastructure. This page is served from a hardened NixOS workstation at home that runs a Bitcoin node, a Lightning node and the Nostr relay this page is assembled from — every block you are reading is a signed event on that relay.\n\nComputer Science (software engineering specialist) at the University of Toronto Scarborough. Before the language models: security, browsers, and a long trail of one-page experiments — the [directory](/directory.html) has all of them."},{"kind":30023,"tags":[["d","now"],["title","Now"],["t","ronishbhatt.com"],["t","section"],["order","0"],["alt","Now — a block of ronishbhatt.com"]],"content":"September 2026. Studying how transformers remember: a zero-parameter dictionary built from a model's own write directions, continuation lenses that run the model's remaining blocks on an intermediate state, and the attention heads that carry a revised fact to the output. The demos above are the plain-English version of that work.\n\nKeeping the box alive: channels, backups, and the relay behind this page."},{"kind":30023,"tags":[["d","colophon"],["title","How this page works"],["t","ronishbhatt.com"],["t","section"],["order","0"],["alt","How this page works — a block of ronishbhatt.com"]],"content":"There is no CMS and no build step. This HTML is an empty shell with a few hundred lines of JavaScript and four self-hosted libraries ([nostr-tools](https://github.com/nbd-wtf/nostr-tools), [preact](https://preactjs.com) + [htm](https://github.com/developit/htm), [marked](https://marked.js.org), [DOMPurify](https://github.com/cure53/DOMPurify)). Everything else — the header, this text, the project cards, the theme — is a Nostr event signed by this site's key.\n\nYour browser asks [my relay](https://relay.ronishbhatt.com) first and three public relays as backups, verifies every signature, keeps the newest version of each block, and stays subscribed: when I edit something, every open tab updates. A signed snapshot is baked into the HTML for the first paint and for the day all four relays are down.\n\nThe blocks are ordinary long-form notes (kind 30023), so they open in any Nostr client — the ⌁ next to each heading is the same event on njump. The chat is NIP-17: your browser mints a key, wraps the message to mine, and my relay stores it. Unlocking with the site key turns this page into its own editor and opens the console for the box that serves it."},{"kind":30023,"tags":[["d","reaching-into-gpt2"],["title","Reaching Into GPT-2"],["t","ronishbhatt.com"],["t","project"],["order","10"],["alt","Reaching Into GPT-2 — a block of ronishbhatt.com"],["summary","Five acts on real traces of a small language model: it recites a sentence it only saw through a keyhole, three of its 144 attention heads get rewired, and it is trained to forget."],["r","/demos/reaching-into-gpt2.html"]],"content":"A plain-English tour of a week of experiments on GPT-2 small, with the actual numbers."},{"kind":30023,"tags":[["d","plant-a-thought"],["title","Plant a Thought"],["t","ronishbhatt.com"],["t","project"],["order","20"],["alt","Plant a Thought — a block of ronishbhatt.com"],["summary","A real 7-million-parameter language model running in your browser. Plant a phrase into its memory, watch it surface in what it writes, then erase it."],["r","/demos/plant-a-thought.html"]],"content":"The whole model is inlined, so the page is 9.5 MB. A word-level GPT trained on TinyStories; the engine is hand-written JavaScript with a KV cache — planting splices a phrase's keys and values into it, erasing compacts them out."},{"kind":30023,"tags":[["d","memory-games"],["title","Three tiny games about memory"],["t","ronishbhatt.com"],["t","project"],["order","30"],["alt","Three tiny games about memory — a block of ronishbhatt.com"],["summary","One-finger games built from the same findings: what a model attends to is what it keeps."],["r","/demos/dont-blink.html"]],"content":"- [Don't Blink](/demos/dont-blink.html) — whatever you look at can't move; lift your finger and you blink.\n- [Copycat](/demos/copycat.html) — copy a sentence from shuffled scraps, then watch GPT-2 do it from the same scraps.\n- [Eye Say](/demos/eye-say.html) — nothing is ever deleted; the brain just runs out of places to look."},{"kind":30023,"tags":[["d","toronto-skate"],["title","Toronto Skating"],["t","ronishbhatt.com"],["t","project"],["order","40"],["alt","Toronto Skating — a block of ronishbhatt.com"],["summary","Live outdoor and indoor skating schedules for Toronto, with a Nostr community layer: chat, comments and votes gated by proof-of-work instead of accounts."],["r","https://sunmoonron.github.io/skate/"]],"content":"[Source](https://github.com/sunmoonron/sunmoonron.github.io). A static site on GitHub Pages; the community layer runs on public relays plus a PoW-gated relay on my box."},{"kind":30023,"tags":[["d","nostrface"],["title","Nostrface"],["t","ronishbhatt.com"],["t","project"],["order","50"],["alt","Nostrface — a block of ronishbhatt.com"],["summary","Steganography on faces: hide a message in the landmarks MediaPipe extracts from a video, entirely in the browser."],["r","/nostrface/"]],"content":"[Source](https://github.com/sunmoonron/vision-steganography)."},{"kind":30023,"tags":[["d","superweight-surgery"],["title","Superweight Surgery"],["t","ronishbhatt.com"],["t","writing"],["order","10"],["alt","Superweight Surgery — a block of ronishbhatt.com"],["summary","Treating a transformer's single most important weight as a black box and patching the circuit around it. December 2025."],["r","/superweight_surg
