<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyperhelical Alphabet – Live Geometric Language Visualiser</title>
  <style>
    body { margin:0; background:#0a0f1e; color:#e0e0e0; font-family:system-ui,sans-serif; }
    canvas { display:block; }
    #ui { position:absolute; top:20px; left:20px; z-index:2; }
    textarea { width:320px; height:80px; background:#131c31; color:#cfd; border:1px solid #2f4f6f; padding:10px; font-size:16px; }
    button { margin:10px 5px; padding:8px 20px; background:#1e3a5f; color:white; border:none; border-radius:4px; cursor:pointer; }
    button:hover { background:#2f5f8f; }
    #info { position:absolute; bottom:20px; right:20px; font-size:14px; opacity:0.7; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>🔤Hyperhelical Encoding</h2>
    <textarea id="input" placeholder="Type here...">Hello World</textarea><br>
    <button onclick="update()">Encode &amp; Visualise</button>
    <button onclick="autoRotate=!autoRotate">Toggle Auto‑Rotation</button>
    <div style="margin-top:10px;font-size:14px;">
      <span>Curve length: <b id="len">0</b> units</span> &nbsp;
      <span>Centroid: <b id="centroid">-</b></span>
    </div>
  </div>
  <div id="info">Click &amp; drag to rotate. Scroll to zoom.</div>

<script>
// ==================== HYPERHELICAL ALPHABET (Clifford torus) ====================
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ ";
const N = LETTERS.length;          // 27
const R1 = 1.8, R2 = 1.1;          // radii of the Clifford torus

function letterTo4D(ch) {
  ch = ch.toUpperCase();
  let idx = LETTERS.indexOf(ch);
  if (idx < 0) idx = 26;           // unknown -> space
  const theta = 2 * Math.PI * idx / N;
  // Two independent angular coordinates (Clifford torus)
  const phi1 = (idx * 0.23) % (2*Math.PI);   // phonetic feature 1
  const phi2 = (idx * 0.37) % (2*Math.PI);   // phonetic feature 2
  // Embedding in ℝ⁴
  const x = R1 * Math.cos(theta);
  const y = R1 * Math.sin(theta);
  const z = R2 * Math.cos(phi1);
  const w = R2 * Math.sin(phi2);
  return [x, y, z, w];
}

// Encode a whole string into a list of 4D points
function encode(str) {
  return str.split('').map(c => ({ch:c, pt:letterTo4D(c)}));
}

// ---- 3D projection (we show x,y,z as space coordinates, colour = w) ----
let points3D = [];
let camera = { rx: -0.6, ry: 0.5, rz: 0, zoom: 3.5 };

function project(p4) {
  // Rotate around Y axis by camera.ry
  let cosY = Math.cos(camera.ry), sinY = Math.sin(camera.ry);
  let x1 = p4[0]*cosY - p4[2]*sinY;
  let z1 = p4[0]*sinY + p4[2]*cosY;
  let y1 = p4[1];
  let w1 = p4[3];
  // Rotate around X axis by camera.rx
  let cosX = Math.cos(camera.rx), sinX = Math.sin(camera.rx);
  let y2 = y1*cosX - z1*sinX;
  let z2 = y1*sinX + z1*cosX;
  // Perspective projection
  let d = 5;
  let scale = d / (d + z2 + 8);
  let sx = x1 * scale * camera.zoom + canvas.width/2;
  let sy = -y2 * scale * camera.zoom + canvas.height/2;
  return {sx, sy, w:w1, z:z2};
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (!points3D.length) return;
  // Draw connecting lines
  ctx.beginPath();
  ctx.strokeStyle = '#5b9bd5';
  ctx.lineWidth = 2;
  for (let i=0; i<points3D.length; i++) {
    let p = project(points3D[i]);
    if (i===0) ctx.moveTo(p.sx, p.sy);
    else ctx.lineTo(p.sx, p.sy);
  }
  ctx.stroke();

  // Draw letter spheres
  for (let i=0; i<points3D.length; i++) {
    let p = project(points3D[i]);
    let r = 4 + (p.w+1.5)*2;  // size depends on w coordinate
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r, 0, 2*Math.PI);
    ctx.fillStyle = `hsl(${i*15%360}, 80%, 65%)`;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(LETTERS[i % N] || '?', p.sx-3, p.sy+3);
  }
}

// ---- UI ----
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
let autoRotate = true;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function update() {
  const text = document.getElementById('input').value;
  const encoded = encode(text);
  points3D = encoded.map(e => e.pt);
  document.getElementById('len').textContent = 
    Math.round(encoded.length * 0.5 * 10)/10;
  // Compute centroid (in ℝ⁴)
  let sum = [0,0,0,0];
  points3D.forEach(p => { sum[0]+=p[0]; sum[1]+=p[1]; sum[2]+=p[2]; sum[3]+=p[3]; });
  let cnt = `(${(sum[0]/points3D.length).toFixed(2)}, ${(sum[1]/points3D.length).toFixed(2)})`;
  document.getElementById('centroid').textContent = cnt;
  draw();
}

// mouse drag for rotation
let dragging = false, lastX, lastY;
canvas.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup', e => { dragging=false; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  let dx = e.clientX - lastX, dy = e.clientY - lastY;
  camera.ry += dx * 0.01;
  camera.rx += dy * 0.01;
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
canvas.addEventListener('wheel', e => {
  camera.zoom *= e.deltaY > 0 ? 0.95 : 1.05;
  draw();
  e.preventDefault();
});

// animation loop for auto-rotate
function animate() {
  if (autoRotate && !dragging) {
    camera.ry += 0.002;
    draw();
  }
  requestAnimationFrame(animate);
}
update();
animate();
</script>
</body>
</html>
