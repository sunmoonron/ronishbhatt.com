<title>Copycat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --ground:#eaf5f1; --paper:#fffdf6; --paper-edge:#e8e1cf; --ink:#233038; --muted:#6b7a85;
  --own:#ff6b35; --glow:#ffcf3f; --good:#2fb673; --bad:#e2493f; --bot:#6c5ce7; --bot-soft:#e4dfff;
  --display:"Baloo 2","Trebuchet MS",Verdana,sans-serif; --body:"Nunito","Trebuchet MS",Verdana,sans-serif;
  --shadow:0 2px 0 var(--paper-edge), 0 10px 24px -14px rgba(35,48,56,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#15202a; --paper:#26343f; --paper-edge:#16222b; --ink:#eef3f7; --muted:#a4b2bd;
    --own:#ff8a5c; --glow:#ffd75e; --good:#4ccb8a; --bad:#ff6b61; --bot:#9b8cff; --bot-soft:#2c2757;
    --shadow:0 2px 0 var(--paper-edge), 0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#15202a; --paper:#26343f; --paper-edge:#16222b; --ink:#eef3f7; --muted:#a4b2bd;
  --own:#ff8a5c; --glow:#ffd75e; --good:#4ccb8a; --bad:#ff6b61; --bot:#9b8cff; --bot-soft:#2c2757;
  --shadow:0 2px 0 var(--paper-edge), 0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-size:34px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1}
h1 span{color:var(--own)}
.pill{font-family:var(--display);font-weight:700;font-size:15px;padding:4px 12px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);white-space:nowrap}
.pill.bot{background:var(--bot-soft);color:var(--bot)}
.rule{font-size:16px;color:var(--muted);text-align:center;padding:0 6px}
.rule b{color:var(--ink)}
.strip{min-height:74px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2}
.strip .w{padding:2px 4px;border-radius:8px}
.strip .w.now{background:var(--glow);color:#3a2a00;box-shadow:0 0 0 4px color-mix(in srgb,var(--glow) 45%,transparent);animation:pulse 1.2s ease-in-out infinite}
.strip .w.pop{animation:pop .35s ease-out}
.strip .blank{display:inline-block;width:2.2em;height:1.1em;border-bottom:3px dashed var(--muted);opacity:.6}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--glow) 25%,transparent)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:480px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:14px 12px 12px;min-height:72px;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.25;cursor:pointer;border:0;text-align:left;color:var(--ink);transform:rotate(var(--rot));transition:transform .15s,opacity .3s,box-shadow .2s;user-select:none;-webkit-user-select:none;display:flex;flex-wrap:wrap;gap:0 .3em;align-items:baseline}
.card:active{transform:rotate(var(--rot)) scale(.96)}
.card:focus-visible{outline:3px solid var(--bot);outline-offset:2px}
.card .dim{color:var(--muted);font-weight:600}
.card .own{color:var(--own);font-size:24px;font-weight:800}
.card.used{opacity:.28;pointer-events:none;transform:rotate(var(--rot)) scale(.95)}
.card.good{box-shadow:0 0 0 4px var(--good),var(--shadow)}
.card.shake{animation:shake .4s}
.card.wiggle{animation:wiggle 1s ease-in-out 2}
.card .botmark{position:absolute;top:-10px;right:-8px;background:var(--bot);color:#fff;font-size:13px;font-family:var(--body);font-weight:800;padding:3px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .3s ease-out}
@keyframes shake{0%,100%{transform:rotate(var(--rot)) translateX(0)}25%{transform:rotate(var(--rot)) translateX(-7px)}75%{transform:rotate(var(--rot)) translateX(7px)}}
@keyframes wiggle{0%,100%{transform:rotate(var(--rot))}25%{transform:rotate(calc(var(--rot) - 4deg)) scale(1.04)}75%{transform:rotate(calc(var(--rot) + 4deg)) scale(1.04)}}
.hint{text-align:center;color:var(--muted);font-size:15px;min-height:1.4em}
.hint b{color:var(--bot)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px}
button.small{font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink);background:var(--paper);border:0;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer}
button.small:focus-visible{outline:3px solid var(--bot);outline-offset:2px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.overlay[hidden]{display:none}
.modal{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:22px 20px;max-width:440px;width:100%;display:grid;gap:14px;text-align:center}
.modal h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.05}
.modal p{margin:0;color:var(--muted);font-size:16px}
.modal p b{color:var(--ink)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{border-radius:14px;padding:12px;background:var(--ground)}
.score .n{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.score .l{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.score .you .n{color:var(--good)} .score .bot .n{color:var(--bot)}
button.big{font-family:var(--display);font-size:22px;font-weight:800;color:#fff;background:var(--own);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--own) 70%,#000)}
button.big:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--own) 70%,#000)}
button.big:focus-visible{outline:3px solid var(--bot);outline-offset:3px}
.stars{font-size:26px;letter-spacing:.1em}
.single{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.single .card{min-height:0;padding:10px 12px;font-size:18px;transform:none;cursor:default}
.tiny{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.strip .w.now,.strip .w.pop,.card.shake,.card.wiggle,.card .botmark{animation:none}}
</style>
