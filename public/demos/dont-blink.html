<title>Don't Blink</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
  :root{
    --night:#12173a; --night2:#1d2352; --ink:#fff6e0; --muted:#b8b9d9;
    --candle:#ffb347; --flame:#ffe08a; --ghost:#d9d4ff; --ghost-dark:#8f8ad9; --pop:#ffd166; --danger:#ff6b8a;
    --font:"Fredoka","Baloo 2","Nunito","Trebuchet MS",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:none}
  .ui{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
  .card{pointer-events:auto;text-align:center;padding:28px 30px;max-width:min(92vw,460px);background:rgba(18,23,58,.82);border:2px solid rgba(255,246,224,.14);border-radius:28px;backdrop-filter:blur(6px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  h1{font-size:clamp(44px,12vw,76px);line-height:1;margin:0 0 6px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
  .rule{font-size:clamp(19px,4.6vw,24px);line-height:1.35;margin:0 0 18px;color:var(--ink)}
  .rule b{color:var(--pop);font-weight:600}
  .go{display:inline-block;font:700 clamp(20px,5vw,26px) var(--font);color:var(--night);background:var(--pop);border:0;border-radius:999px;padding:14px 30px;cursor:pointer;animation:bob 1.4s ease-in-out infinite}
  .go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .small{margin:14px 0 0;font-size:15px;color:var(--muted)}
  .score{font-size:clamp(34px,9vw,54px);font-weight:700;margin:4px 0 0;color:var(--pop)}
  .sub{font-size:18px;color:var(--ink);margin:2px 0 16px}
  .hud{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;gap:22px;font-size:22px;font-weight:600;pointer-events:none;color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .hud span b{color:var(--pop);font-weight:700;font-variant-numeric:tabular-nums}
  .foot{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;opacity:.8}
  .hidden{display:none !important}
  .snd{position:fixed;top:12px;right:14px;font:600 14px var(--font);color:var(--muted);background:rgba(18,23,58,.6);border:1px solid rgba(255,246,224,.18);border-radius:999px;padding:6px 12px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.go{animation:none}}
</style>

<canvas id="c" aria-label="Don't Blink game: hold your finger on ghosts to freeze them and keep the candle lit"></canvas>
<div class="hud hidden" id="hud"><span>lit for <b id="t">0</b>s</span><span>popped <b id="p">0</b></span></div>
<button class="snd" id="snd" aria-pressed="false">sound off</button>
<div class="ui" id="ui">
  <div class="card" id="card">
    <h1>Don't Blink</h1>
    <p class="rule">Ghosts want the candle.<br>Whatever you <b>look at</b> can't move.<br>Stare at a ghost to <b>pop</b> it.</p>
    <button class="go" id="go">Touch to play</button>
    <p class="small">Your finger is your eyes. Lift it and you blink.</p>
  </div>
</div>
<div class="foot">Made from a week inside a language model, where nothing changes while it is being looked at.</div>

<script>
(function () {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const ui = document.getElementById("ui"), card = document.getElementById("card"), hud = document.getElementById("hud");
  const tEl = document.getElementById("t"), pEl = document.getElementById("p"), sndBtn = document.getElementById("snd");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, DPR = 1, R = 90;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.max(70, Math.min(110, Math.min(W, H) / 5.5));
  }
  addEventListener("resize", resize); resize();

  /* ---------- sound: tiny synth, on only when asked ---------- */
  let AC = null, soundOn = false;
  function beep(f0, f1, dur, type, vol) {
    if (!soundOn || !AC) return;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  sndBtn.addEventListener("click", e => {
    e.stopPropagation();
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { AC = null; } }
    soundOn = !soundOn && !!AC; sndBtn.textContent = soundOn ? "sound on" : "sound off"; sndBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) beep(660, 990, 0.12, "triangle", 0.2);
  });

  /* ---------- game state ---------- */
  const S = { mode: "title", t: 0, popped: 0, ghosts: [], parts: [], spawnIn: 1.2, best: 0, gaze: { x: -999, y: -999, on: false, type: "mouse" }, lastMouse: -99, shake: 0, flameSeed: Math.random() * 100 };
  try { S.best = parseInt(localStorage.getItem("dontblink-best") || "0", 10) || 0; } catch (e) {}
  const cx = () => W / 2, cy = () => H / 2 + 20;

  function spawnGhost() {
    const side = Math.floor(Math.random() * 4), m = 40;
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -m; } else if (side === 1) { x = W + m; y = Math.random() * H; } else if (side === 2) { x = Math.random() * W; y = H + m; } else { x = -m; y = Math.random() * H; }
    const fast = S.t > 18 && Math.random() < Math.min(0.4, (S.t - 18) / 60);
    const base = 34 + Math.min(70, S.t * 1.6);
    S.ghosts.push({ x, y, r: fast ? 17 : 24, speed: base * (fast ? 1.9 : 1) * (0.85 + Math.random() * 0.3), stare: 0, frozen: false, wob: Math.random() * 6.28, fast, hue: Math.random() });
  }
  function reset() {
    S.t = 0; S.popped = 0; S.ghosts = []; S.parts = []; S.spawnIn = 0.6; S.shake = 0;
    for (let i = 0; i < 3; i++) spawnGhost();
  }
  function start() {
    if (!AC && soundOn) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    reset(); S.mode = "play"; ui.classList.add("hidden"); hud.classList.remove("hidden"); beep(520, 780, 0.15, "triangle", 0.15);
  }
  function gameOver() {
    S.mode = "over"; S.shake = 1; beep(300, 80, 0.5, "sawtooth", 0.2);
    if (S.popped > S.best) { S.best = S.popped; try { localStorage.setItem("dontblink-best", String(S.best)); } catch (e) {} }
    card.innerHTML = `<h1>Blown out</h1><p class="sub">The candle stayed lit for</p><p class="score">${S.t.toFixed(1)} s</p><p class="sub">You popped <b>${S.popped}</b> ghost${S.popped === 1 ? "" : "s"}${S.best > 0 ? ` · best ${S.best}` : ""}</p><button class="go" id="go">Again</button><p class="small">Tip: stare at the closest one. Ghosts you are not watching keep coming.</p>`;
    hud.classList.add("hidden"); ui.classList.remove("hidden");
    document.getElementById("go").addEventListener("click", start);
  }
  document.getElementById("go").addEventListener("click", start);
  if (matchMedia("(hover: hover) and (pointer: fine)").matches) { document.getElementById("go").textContent = "Click to play"; document.querySelector(".small").textContent = "Your mouse is your eyes. Ghosts move wherever you are not looking."; }

  /* ---------- gaze from pointer ---------- */
  function setGaze(e, down) {
    S.gaze.x = e.clientX; S.gaze.y = e.clientY; S.gaze.type = e.pointerType || "mouse";
    if (S.gaze.type === "mouse") { S.lastMouse = S.t; S.gaze.on = true; } else { S.gaze.on = down; }
  }
  cv.addEventListener("pointerdown", e => { setGaze(e, true); cv.setPointerCapture && cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => setGaze(e, e.buttons > 0 || e.pointerType === "mouse"));
  cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") S.gaze.on = false; });
  cv.addEventListener("pointercancel", () => { S.gaze.on = false; });
  cv.addEventListener("pointerleave", () => { S.gaze.on = false; });
  ui.addEventListener("pointerdown", e => { if (S.mode !== "play" && e.target === ui) start(); });

  /* ---------- update ---------- */
  function update(dt) {
    if (S.mode !== "play") {
      for (const g of S.ghosts) { g.wob += dt * 3; const ang = Math.atan2(cy() - g.y, cx() - g.x) + Math.sin(g.wob) * 0.35; g.x += Math.cos(ang) * 22 * dt; g.y += Math.sin(ang) * 22 * dt; if (Math.hypot(g.x - cx(), g.y - cy()) < 120) { g.x = cx() + (Math.random() - 0.5) * W * 1.6; g.y = cy() + (Math.random() - 0.5) * H * 1.6; } }
      return;
    }
    S.t += dt;
    S.spawnIn -= dt;
    if (S.spawnIn <= 0) { spawnGhost(); S.spawnIn = Math.max(0.45, 1.7 - S.t * 0.03); }
    const gx = S.gaze.x, gy = S.gaze.y, on = S.gaze.on;
    for (const g of S.ghosts) {
      const d = Math.hypot(g.x - gx, g.y - gy);
      g.frozen = on && d < R + g.r * 0.4;
      if (g.frozen) {
        g.stare += dt;
        if (g.stare >= 1.0) { g.dead = true; S.popped++; burst(g.x, g.y, g.fast ? 14 : 22, "#ffd166"); beep(700 + Math.random() * 200, 1400, 0.18, "triangle", 0.18); }
      } else {
        g.stare = Math.max(0, g.stare - dt * 0.8);
        g.wob += dt * 3;
        const ang = Math.atan2(cy() - g.y, cx() - g.x) + Math.sin(g.wob) * 0.35;
        g.x += Math.cos(ang) * g.speed * dt; g.y += Math.sin(ang) * g.speed * dt;
        if (Math.hypot(g.x - cx(), g.y - cy()) < 30 + g.r * 0.6) { burst(cx(), cy(), 40, "#ff6b8a"); gameOver(); return; }
      }
    }
    S.ghosts = S.ghosts.filter(g => !g.dead);
    for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; }
    S.parts = S.parts.filter(p => p.life > 0);
    tEl.textContent = S.t.toFixed(0); pEl.textContent = S.popped;
  }
  function burst(x, y, n, col) {
    if (reduced) n = Math.min(n, 8);
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 180; S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.5 + Math.random() * 0.5, col, r: 2 + Math.random() * 4 }); }
  }

  /* ---------- draw ---------- */
  function drawGhost(g, t) {
    const { x, y, r } = g;
    ctx.save(); ctx.translate(x, y + (g.frozen ? 0 : Math.sin(g.wob * 2) * 3));
    if (g.frozen) { ctx.rotate(Math.sin(t * 40) * 0.02 * g.stare); }
    // body
    ctx.fillStyle = g.frozen ? `rgba(160,160,180,${0.9 - g.stare * 0.35})` : (g.fast ? "#ffc9d9" : "#d9d4ff");
    ctx.beginPath(); ctx.arc(0, -r * 0.15, r, Math.PI, 0); ctx.lineTo(r, r * 0.7);
    const k = 4; for (let i = 0; i < k; i++) { const bx = r - (i + 0.5) * (2 * r / k); ctx.quadraticCurveTo(bx + r / k, r * 0.95 + (g.frozen ? 0 : Math.sin(g.wob * 3 + i) * 3), bx, r * 0.7); }
    ctx.lineTo(-r, r * 0.7); ctx.closePath(); ctx.fill();
    // eyes
    ctx.fillStyle = "#1a1c3a";
    if (g.frozen) { ctx.lineWidth = 3; ctx.strokeStyle = "#1a1c3a"; ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.2); ctx.lineTo(-r * 0.2, -r * 0.2); ctx.moveTo(r * 0.2, -r * 0.2); ctx.lineTo(r * 0.5, -r * 0.2); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.2, r * 0.17, 0, 6.28); ctx.arc(r * 0.35, -r * 0.2, r * 0.17, 0, 6.28); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.26, r * 0.06, 0, 6.28); ctx.arc(r * 0.4, -r * 0.26, r * 0.06, 0, 6.28); ctx.fill(); }
    // mouth
    ctx.strokeStyle = "#1a1c3a"; ctx.lineWidth = 2; ctx.beginPath(); if (g.frozen) { ctx.arc(0, r * 0.25, r * 0.18, 0.15, Math.PI - 0.15); } else { ctx.arc(0, r * 0.3, r * 0.14, 0, 6.28); } ctx.stroke();
    // stare ring
    if (g.stare > 0.02) { ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, r + 8, -Math.PI / 2, -Math.PI / 2 + 6.283 * Math.min(1, g.stare)); ctx.stroke(); }
    ctx.restore();
  }
  function drawCandle(t) {
    const x = cx(), y = cy();
    ctx.fillStyle = "#f2e6c9"; ctx.fillRect(x - 12, y - 6, 24, 46);
    ctx.fillStyle = "#e0d0a8"; ctx.fillRect(x - 12, y - 6, 6, 46);
    ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x, y - 14); ctx.stroke();
    const fl = 1 + Math.sin(t * 17 + S.flameSeed) * 0.08 + Math.sin(t * 5.3) * 0.05;
    const gr = ctx.createRadialGradient(x, y - 26, 2, x, y - 26, 26 * fl);
    gr.addColorStop(0, "#fff7d6"); gr.addColorStop(0.45, "#ffd166"); gr.addColorStop(1, "rgba(255,140,60,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y - 26, 12 * fl, 22 * fl, 0, 0, 6.28); ctx.fill();
  }
  function draw(t) {
    ctx.save();
    if (S.shake > 0) { ctx.translate((Math.random() - 0.5) * 12 * S.shake, (Math.random() - 0.5) * 12 * S.shake); S.shake = Math.max(0, S.shake - 0.03); }
    const bg = ctx.createRadialGradient(cx(), cy(), 10, cx(), cy(), Math.max(W, H) * 0.8);
    bg.addColorStop(0, "#2a2f66"); bg.addColorStop(0.35, "#1a1f4c"); bg.addColorStop(1, "#0d1030");
    ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
    // candle glow
    const cg = ctx.createRadialGradient(cx(), cy() - 20, 5, cx(), cy() - 20, 170);
    cg.addColorStop(0, "rgba(255,190,90,.35)"); cg.addColorStop(1, "rgba(255,190,90,0)"); ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
    drawCandle(t);
    for (const g of S.ghosts) drawGhost(g, t);
    for (const p of S.parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); }
    ctx.globalAlpha = 1;
    // gaze
    if (S.gaze.on) {
      const g = ctx.createRadialGradient(S.gaze.x, S.gaze.y, R * 0.2, S.gaze.x, S.gaze.y, R);
      g.addColorStop(0, "rgba(255,245,200,.22)"); g.addColorStop(0.8, "rgba(255,245,200,.10)"); g.addColorStop(1, "rgba(255,245,200,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(S.gaze.x, S.gaze.y, R, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "rgba(255,245,200,.55)"; ctx.lineWidth = 2; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.arc(S.gaze.x, S.gaze.y, R, t * 0.6, t * 0.6 + 6.283); ctx.stroke(); ctx.setLineDash([]);
      // little eye icon
      ctx.fillStyle = "rgba(255,246,224,.9)"; ctx.beginPath(); ctx.ellipse(S.gaze.x, S.gaze.y, 12, 7, 0, 0, 6.28); ctx.fill(); ctx.fillStyle = "#12173a"; ctx.beginPath(); ctx.arc(S.gaze.x, S.gaze.y, 4, 0, 6.28); ctx.fill();
    } else if (S.mode === "play") {
      ctx.fillStyle = "rgba(255,246,224,.7)"; ctx.font = "600 20px " + getComputedStyle(document.body).fontFamily; ctx.textAlign = "center"; ctx.fillText("you blinked! touch to look", cx(), H - 40);
    }
    ctx.restore();
  }
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(now / 1000);
    requestAnimationFrame(loop);
  }
  // title-screen ghosts drifting around
  for (let i = 0; i < 4; i++) { spawnGhost(); }
  requestAnimationFrame(loop);
})();
</script>
