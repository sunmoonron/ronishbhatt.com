<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Courses - Ronish Bhatt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; --accent: #22c55e; --accent-dim: #166534; --bg: #0a0a0a; --card: #111; --border: #222; --text: #e5e7eb; --muted: #9ca3af; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body:not(.embedded) {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    
    body.embedded { background: transparent; padding: 0; }
    
    .courses-container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .courses-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    
    .courses-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--accent), #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .courses-header p {
      color: var(--muted);
      font-size: 0.85rem;
    }
    
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .filter-tab {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-tab:hover, .filter-tab.active {
      border-color: var(--accent);
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent);
    }
    
    .course-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.6rem 0.75rem;
      border-radius: 0.5rem;
      transition: background 0.2s;
    }
    
    .course-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    
    .course-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      white-space: nowrap;
      min-width: 2.5rem;
      text-align: center;
    }
    
    .course-badge.cs { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .course-badge.math { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .course-badge.other { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    
    .course-info {
      flex: 1;
      min-width: 0;
    }
    
    .course-code {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem;
    }
    
    .course-name {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.3;
    }
    
    .expand-all {
      text-align: center;
      margin-top: 1rem;
    }
    
    .expand-all button {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .expand-all button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .hidden { display: none !important; }
    
    @media (max-width: 480px) {
      .courses-container { padding: 0 0.5rem; }
      .stats-bar { gap: 1rem; }
      .filter-tabs { gap: 0.25rem; }
      .filter-tab { padding: 0.3rem 0.5rem; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="courses-container">
    <div class="courses-header">
      <h2>📚 Academic Journey</h2>
      <p>University of Toronto Scarborough</p>
      <p>Computer Science - Software Engineering Specialist</p>
    </div>
    
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="total-courses">0</div>
        <div class="stat-label">Courses</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="cs-count">0</div>
        <div class="stat-label">CS Courses</div>
      </div>
    </div>
    
    <div class="filter-tabs">
      <button class="filter-tab" data-filter="all">All</button>
      <button class="filter-tab active" data-filter="cs">Computer Science</button>
      <button class="filter-tab" data-filter="math">Math & Stats</button>
      <button class="filter-tab" data-filter="other">Other</button>
    </div>
    
    <div id="courses-list">
    </div>    
  </div>    
  </div>

  <script>
    (function() {
      'use strict';
      
      if (window.self !== window.top || window.location.hash === '#embedded') {
        document.body.classList.add('embedded');
      }
      
      const courses = [
        { type: "cs", badge: "CS", code: "CSCA08", name: "Introduction to Computer Science I" },
        { type: "math", badge: "MATH", code: "CSCA67", name: "Discrete Mathematics" },
        { type: "other", badge: "LNG", code: "LINA01", name: "Introduction to Linguistics" },
        { type: "math", badge: "MATH", code: "MATA31", name: "Calculus I for Mathematical Sciences" },
        { type: "cs", badge: "CS", code: "CSCA48", name: "Introduction to Computer Science II" },
        { type: "other", badge: "SCI", code: "EESA06", name: "Introduction to Planet Earth" },
        { type: "math", badge: "MATH", code: "MATA22", name: "Linear Algebra I for Mathematical Sciences" },
        { type: "math", badge: "MATH", code: "MATA37", name: "Calculus II for Mathematical Sciences" },
        { type: "cs", badge: "CS", code: "CSCB09", name: "Software Tools and Systems Programming" },
        { type: "other", badge: "PSY", code: "PSYA01", name: "Introduction to Biological and Cognitive Psychology" },
        { type: "math", badge: "STAT", code: "STAB52", name: "Introduction to Probability" },
        { type: "other", badge: "ART", code: "VPMA93", name: "Listening to Music" },
        { type: "cs", badge: "CS", code: "CSCB07", name: "Software Design" },
        { type: "cs", badge: "CS", code: "CSCB36", name: "Introduction to the Theory of Computation" },
        { type: "cs", badge: "CS", code: "CSCB58", name: "Computer Organization" },
        { type: "math", badge: "MATH", code: "MATB24", name: "Linear Algebra II" },
        { type: "math", badge: "MATH", code: "MATB41", name: "Techniques of the Calculus of Several Variables I" },
        { type: "cs", badge: "CS", code: "CSCB63", name: "Design and Analysis of Data Structures" },
        { type: "cs", badge: "CS", code: "CSCC10", name: "Human-Computer Interaction" },
        { type: "cs", badge: "CS", code: "CSCC24", name: "Principles of Programming Languages" },
        { type: "cs", badge: "CS", code: "CSCC01", name: "Introduction to Software Engineering" },
        { type: "cs", badge: "CS", code: "CSCC37", name: "Introduction to Numerical Algorithms for Computational Mathematics" },
        { type: "cs", badge: "CS", code: "CSCC43", name: "Introduction to Databases" },
        { type: "cs", badge: "CS", code: "CSCD27", name: "Computer and Network Security" },
        { type: "cs", badge: "CS", code: "CSCD58", name: "Computer Networks" },
        { type: "cs", badge: "CS", code: "CSCC09", name: "Programming on the Web" },
        { type: "other", badge: "SCI", code: "EESA09", name: "Wind" },
        { type: "other", badge: "SCI", code: "EESA10", name: "Human Health and the Environment" },
        { type: "cs", badge: "CS", code: "CSCC46", name: "Social and Information Networks" },
        { type: "cs", badge: "CS", code: "CSCD03", name: "Social Impact of Information Technology" },
        { type: "other", badge: "ECON", code: "MGEA02", name: "Introduction to Microeconomics: A Mathematical Approach" },
        { type: "other", badge: "BUS", code: "MGTA01", name: "Introduction to Business" },
        { type: "cs", badge: "CS", code: "CSCC73", name: "Algorithm Design and Analysis" },
        { type: "cs", badge: "CS", code: "CSCD01", name: "Engineering Large Software Systems" },
        { type: "other", badge: "ENG", code: "ENGA11", name: "Literature and Film for Our Time: Dawn of the Digital" },
        { type: "other", badge: "GEO", code: "GGRA03", name: "Cities and Environments" },
        { type: "other", badge: "PHIL", code: "PHLA10", name: "Reason and Truth" },
        { type: "cs", badge: "CS", code: "CSC369", name: "Operating Systems (St. George)" },
        { type: "cs", badge: "CS", code: "CSC463", name: "Computational Complexity and Computability (St. George)" },
        { type: "cs", badge: "CS", code: "CSCC11", name: "Introduction to Machine Learning and Data Mining" }
      ].reverse();
      
      function renderCourses(filter = 'all') {
        const coursesList = document.getElementById('courses-list');
        coursesList.innerHTML = '';
        
        courses.forEach(course => {
          if (filter === 'all' || course.type === filter) {
            const courseItem = document.createElement('div');
            courseItem.className = 'course-item';
            courseItem.setAttribute('data-type', course.type);
            
            courseItem.innerHTML = `
              <span class="course-badge ${course.type}">${course.badge}</span>
              <div class="course-info">
                <div class="course-code">${course.code}</div>
                <div class="course-name">${course.name}</div>
              </div>
            `;
            
            coursesList.appendChild(courseItem);
          }
        });
      }
      
      // Initial render with active filter
      const activeTab = document.querySelector('.filter-tab.active');
      const initialFilter = activeTab ? activeTab.dataset.filter : 'all';
      renderCourses(initialFilter);
      
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          
          const filter = tab.dataset.filter;
          renderCourses(filter);
        });
      });
      
      document.getElementById('total-courses').textContent = courses.length;
      document.getElementById('cs-count').textContent = courses.filter(c => c.type === 'cs').length;
    })();
  </script>
</body>
</html>
