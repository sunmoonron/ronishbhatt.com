<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfiniLearn - Infinite Scroll Learning</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #555;
      --border: #e0e0e0;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --wiki: #3366cc;
      --trivia: #7c3aed;
      --numbers: #059669;
      --countries: #ea580c;
      --space: #4338ca;
      --header-bg: rgba(240,242,245,0.85);
      --bookmark: #f59e0b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d1a;
        --card-bg: #1a1a2e;
        --text: #e4e4e4;
        --text-secondary: #999;
        --border: #2a2a40;
        --shadow: 0 2px 12px rgba(0,0,0,0.4);
        --header-bg: rgba(13,13,26,0.85);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
      text-align: center;
    }

    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { opacity: 0.4; font-weight: 300; }

    #stats-line {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin: 2px 0 12px;
      transition: opacity 0.3s;
    }

    .filters {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn.active { color: #fff; border-color: transparent; }

    .filter-btn[data-filter="wiki"].active { background: var(--wiki); }
    .filter-btn[data-filter="trivia"].active { background: var(--trivia); }
    .filter-btn[data-filter="numbers"].active { background: var(--numbers); }
    .filter-btn[data-filter="countries"].active { background: var(--countries); }
    .filter-btn[data-filter="space"].active { background: var(--space); }

    #bookmarks-btn { border-color: var(--bookmark); color: var(--bookmark); }
    #bookmarks-btn:hover { background: var(--bookmark); color: #fff; }

    /* ── Resume Banner ── */
    .resume-banner {
      max-width: 640px;
      margin: 16px auto 0;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .resume-banner.hidden { display: none; }

    .resume-banner p { font-size: 0.9rem; margin-bottom: 12px; color: var(--text-secondary); }
    .resume-banner strong { color: var(--text); }

    .resume-actions { display: flex; gap: 10px; justify-content: center; }

    .resume-actions button {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      transition: all 0.2s;
    }

    .resume-actions .primary {
      background: var(--trivia);
      color: #fff;
      border-color: var(--trivia);
    }

    /* ── Feed ── */
    #feed {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 0;
    }

    /* ── Session Divider ── */
    .session-divider {
      text-align: center;
      padding: 20px 0;
      font-size: 0.78rem;
      color: var(--text-secondary);
      position: relative;
    }

    .session-divider::before,
    .session-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 28%;
      height: 1px;
      background: var(--border);
    }

    .session-divider::before { left: 8%; }
    .session-divider::after { right: 8%; }

    /* ── Cards ── */
    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeInUp 0.45s ease forwards;
      border: 1px solid var(--border);
    }

    .card.restored {
      opacity: 1;
      transform: none;
      animation: none;
    }

    .card-accent { height: 4px; }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 10px;
      margin: 16px 20px 0;
    }

    .card-body { padding: 12px 20px 20px; }
    .card-body h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
    .card-body p { font-size: 0.92rem; color: var(--text-secondary); line-height: 1.6; }

    /* ── Bookmark Button ── */
    .bookmark-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--card-bg);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: all 0.2s;
      opacity: 0;
    }

    .card:hover .bookmark-btn,
    .bookmark-btn.saved { opacity: 1; }

    .bookmark-btn:hover { transform: scale(1.1); }
    .bookmark-btn.saved { color: var(--bookmark); }

    .bookmark-btn svg { width: 16px; height: 16px; }

    /* ── Wiki ── */
    .wiki-card .card-accent { background: var(--wiki); }
    .wiki-card .card-badge { color: var(--wiki); background: rgba(51,102,204,0.1); }

    .wiki-thumbnail { width: 100%; max-height: 280px; object-fit: cover; display: block; }

    .wiki-description {
      font-size: 0.78rem !important;
      text-transform: capitalize;
      opacity: 0.6;
      margin-bottom: 4px !important;
    }

    .card-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
    }

    .wiki-card .card-link { color: var(--wiki); }
    .card-link:hover { text-decoration: underline; }

    /* ── Trivia ── */
    .trivia-card .card-accent { background: var(--trivia); }
    .trivia-card .card-badge { color: var(--trivia); background: rgba(124,58,237,0.1); }

    .trivia-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }

    .trivia-category {
      font-size: 0.75rem;
      background: rgba(124,58,237,0.08);
      color: var(--trivia);
      padding: 2px 10px;
      border-radius: 8px;
      font-weight: 500;
    }

    .trivia-difficulty { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; text-transform: capitalize; }
    .trivia-question { color: var(--text) !important; font-weight: 500; font-size: 1rem !important; margin-bottom: 14px !important; }
    .trivia-options { display: flex; flex-direction: column; gap: 8px; }

    .trivia-option {
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.2s;
    }

    .trivia-option:hover:not(:disabled) { border-color: var(--trivia); background: rgba(124,58,237,0.05); }
    .trivia-option:disabled { cursor: default; opacity: 0.7; }
    .trivia-option.correct { border-color: #16a34a !important; background: rgba(22,163,74,0.1) !important; color: #16a34a !important; opacity: 1 !important; font-weight: 600; }
    .trivia-option.wrong { border-color: #dc2626 !important; background: rgba(220,38,38,0.1) !important; color: #dc2626 !important; opacity: 1 !important; }

    /* ── Numbers ── */
    .number-card .card-accent { background: var(--numbers); }
    .number-card .card-badge { color: var(--numbers); background: rgba(5,150,105,0.1); }
    .number-display { font-size: 3rem; font-weight: 800; color: var(--numbers); margin-bottom: 6px; line-height: 1.1; }

    /* ── Countries ── */
    .country-card .card-accent { background: var(--countries); }
    .country-card .card-badge { color: var(--countries); background: rgba(234,88,12,0.1); }
    .country-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }

    .country-flag {
      width: 64px; height: 44px; object-fit: cover;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .country-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .country-fact { font-size: 0.85rem; }

    .country-fact strong {
      display: block; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--text-secondary); font-weight: 500;
    }

    /* ── Space ── */
    .space-card .card-accent { background: var(--space); }
    .space-card .card-badge { color: var(--space); background: rgba(67,56,202,0.1); }
    .space-image { width: 100%; max-height: 360px; object-fit: cover; display: block; }
    .space-date { display: inline-block; margin-top: 8px; font-size: 0.75rem; color: var(--text-secondary); }

    .space-explanation { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .space-explanation.expanded { display: block; -webkit-line-clamp: unset; }

    .show-more-btn {
      background: none; border: none; color: var(--space); font-size: 0.83rem;
      cursor: pointer; padding: 4px 0; font-family: inherit; font-weight: 500;
    }

    .show-more-btn:hover { text-decoration: underline; }

    /* ── Bookmarks Drawer ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 250; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }

    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .bookmarks-drawer {
      position: fixed; top: 0; right: 0;
      width: min(420px, 92vw); height: 100vh;
      background: var(--bg); z-index: 300;
      transform: translateX(100%); transition: transform 0.3s ease;
      overflow-y: auto; box-shadow: -4px 0 20px rgba(0,0,0,0.2);
    }

    .bookmarks-drawer.open { transform: translateX(0); }

    .drawer-header {
      position: sticky; top: 0; background: var(--bg);
      padding: 20px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    .drawer-header h2 { font-size: 1.1rem; }

    .drawer-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--card-bg); color: var(--text); font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .drawer-body { padding: 16px; }

    .drawer-empty {
      text-align: center; padding: 40px 20px; color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .drawer-item {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin-bottom: 12px;
      position: relative;
    }

    .drawer-item-badge {
      font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.4px; margin-bottom: 6px; opacity: 0.6;
    }

    .drawer-item h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .drawer-item p { font-size: 0.82rem; color: var(--text-secondary); }

    .drawer-remove {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: var(--text-secondary);
      cursor: pointer; font-size: 1rem; padding: 4px;
      line-height: 1;
    }

    .drawer-remove:hover { color: #dc2626; }

    /* ── Loader ── */
    #loader { text-align: center; padding: 30px 20px 60px; color: var(--text-secondary); font-size: 0.85rem; }

    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--trivia); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 10px;
    }

    #loader.hidden { display: none; }

    /* ── Empty State ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 10px 20px; border-radius: 10px; font-size: 0.85rem;
      z-index: 200; transition: transform 0.3s ease; white-space: nowrap;
      background: #dc2626; color: #fff;
    }

    .toast.info { background: var(--trivia); }
    .toast.success { background: var(--numbers); }
    .toast.visible { transform: translateX(-50%) translateY(0); }

    /* ── Scroll-to-top ── */
    #scroll-top {
      position: fixed; bottom: 24px; right: 24px; width: 42px; height: 42px;
      border-radius: 50%; border: none; background: var(--card-bg); color: var(--text);
      font-size: 1.2rem; box-shadow: var(--shadow); cursor: pointer;
      opacity: 0; transition: opacity 0.3s; z-index: 150; font-family: inherit;
    }

    #scroll-top.visible { opacity: 1; }

    /* ── Counter ── */
    #counter { text-align: center; font-size: 0.75rem; color: var(--text-secondary); padding: 4px 0; opacity: 0.6; }

    /* ── Kbd Hint ── */
    .kbd-hint {
      position: fixed; bottom: 24px; left: 24px;
      font-size: 0.7rem; color: var(--text-secondary);
      opacity: 0; transition: opacity 0.5s;
      pointer-events: none;
    }

    .kbd-hint.visible { opacity: 0.5; }
    .kbd-hint kbd {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px; font-family: inherit; font-size: 0.68rem;
    }

    /* ── Animations ── */
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      header h1 { font-size: 1.3rem; }
      .card-body { padding: 10px 16px 16px; }
      .card-badge { margin: 12px 16px 0; }
      .country-facts { grid-template-columns: 1fr; }
      .number-display { font-size: 2.2rem; }
      .bookmark-btn { opacity: 0.7; }
      .kbd-hint { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>InfiniLearn <span>/</span> scroll. learn. repeat.</h1>
    <p id="stats-line">An endless stream of knowledge from across the web</p>
    <div class="filters">
      <button class="filter-btn active" data-filter="wiki">Wiki</button>
      <button class="filter-btn active" data-filter="trivia">Trivia</button>
      <button class="filter-btn active" data-filter="numbers">Facts</button>
      <button class="filter-btn active" data-filter="countries">World</button>
      <button class="filter-btn active" data-filter="space">Space</button>
      <button class="filter-btn" id="bookmarks-btn">Saved (0)</button>
    </div>
  </header>

  <div id="resume-banner" class="resume-banner hidden"></div>
  <div id="feed"></div>
  <div id="counter"></div>
  <div id="loader"><div class="spinner"></div>Loading knowledge&hellip;</div>
  <div id="sentinel" style="height:1px;"></div>
  <button id="scroll-top" title="Scroll to top">&uarr;</button>
  <div id="toast" class="toast"></div>
  <div class="kbd-hint" id="kbd-hint"><kbd>j</kbd><kbd>k</kbd> navigate &middot; <kbd>b</kbd> bookmark</div>

  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="bookmarks-drawer" class="bookmarks-drawer">
    <div class="drawer-header">
      <h2>Saved Items</h2>
      <button class="drawer-close" id="drawer-close">&times;</button>
    </div>
    <div class="drawer-body" id="bookmarks-list"></div>
  </aside>

<script>
// ═══════════════════════════════════════════════════
// Configuration
// ═══════════════════════════════════════════════════
const BATCH_SIZE = 4;
const REFILL_THRESHOLD = 6;
const SOURCE_COOLDOWN = 3000;
const ERROR_COOLDOWN = 30000;
const SEEN_MAX = 2000;
const SESSION_MAX_ITEMS = 40;
const SESSION_EXPIRE_MS = 7 * 24 * 3600 * 1000; // 7 days

const SKEYS = {
  SEEN: 'il_seen',
  SESSION: 'il_session',
  BOOKMARKS: 'il_bookmarks',
  STATS: 'il_stats',
  ENGAGEMENT: 'il_engagement',
  FILTERS: 'il_filters'
};

// ═══════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════
function decodeHTML(str) {
  const el = document.createElement('textarea');
  el.innerHTML = str;
  return el.value;
}

function formatPop(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function formatArea(n) {
  return n ? n.toLocaleString() + ' km\u00B2' : '\u2014';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fingerprint(item) {
  switch (item.type) {
    case 'wiki': return 'w:' + item.title;
    case 'trivia': return 't:' + item.question;
    case 'numbers': return 'n:' + item.number + ':' + item.numType;
    case 'countries': return 'c:' + item.name;
    case 'space': return 's:' + item.title;
    default: return item.type + ':' + JSON.stringify(item).slice(0, 60);
  }
}

function safeGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}

function safeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* full */ }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('visible'), 3000);
}

function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return 'just now';
  if (d < 3600000) return Math.floor(d / 60000) + 'm ago';
  if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
  return Math.floor(d / 86400000) + 'd ago';
}

const BOOKMARK_SVG_OUTLINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>';
const BOOKMARK_SVG_FILLED = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>';

// ═══════════════════════════════════════════════════
// Seen Tracker — never show the same content twice
// ═══════════════════════════════════════════════════
const seen = {
  _set: new Set(),

  load() { this._set = new Set(safeGet(SKEYS.SEEN, [])); },

  has(fp) { return this._set.has(fp); },

  add(fp) {
    this._set.add(fp);
    if (this._set.size > SEEN_MAX) {
      const it = this._set.values();
      for (let i = 0; i < 200; i++) { this._set.delete(it.next().value); }
    }
  },

  save() { safeSet(SKEYS.SEEN, [...this._set]); }
};

// ═══════════════════════════════════════════════════
// Stats — lifetime metrics
// ═══════════════════════════════════════════════════
const stats = {
  totalSeen: 0,
  triviaAnswered: 0,
  triviaCorrect: 0,
  sessionsCount: 0,
  streak: 0,
  lastVisitDate: null,   // 'YYYY-MM-DD'
  firstVisitDate: null,

  load() {
    const s = safeGet(SKEYS.STATS, null);
    if (s) Object.assign(this, s);
    this._updateStreak();
    this.sessionsCount++;
    this.save();
  },

  _updateStreak() {
    const today = new Date().toISOString().slice(0, 10);
    if (!this.firstVisitDate) this.firstVisitDate = today;
    if (!this.lastVisitDate) { this.lastVisitDate = today; this.streak = 1; return; }
    if (this.lastVisitDate === today) return;
    const last = new Date(this.lastVisitDate + 'T00:00:00');
    const now = new Date(today + 'T00:00:00');
    const diffDays = Math.round((now - last) / 86400000);
    this.streak = diffDays === 1 ? this.streak + 1 : 1;
    this.lastVisitDate = today;
  },

  recordView() { this.totalSeen++; },
  recordTrivia(correct) { this.triviaAnswered++; if (correct) this.triviaCorrect++; },

  get triviaAccuracy() {
    return this.triviaAnswered ? Math.round(100 * this.triviaCorrect / this.triviaAnswered) : 0;
  },

  save() {
    safeSet(SKEYS.STATS, {
      totalSeen: this.totalSeen, triviaAnswered: this.triviaAnswered,
      triviaCorrect: this.triviaCorrect, sessionsCount: this.sessionsCount,
      streak: this.streak, lastVisitDate: this.lastVisitDate,
      firstVisitDate: this.firstVisitDate
    });
  },

  render() {
    const parts = [];
    if (this.totalSeen > 0) parts.push(this.totalSeen + ' learned');
    if (this.triviaAnswered > 0) parts.push(this.triviaAccuracy + '% trivia');
    if (bookmarks.count() > 0) parts.push(bookmarks.count() + ' saved');
    if (this.streak > 1) parts.push(this.streak + '-day streak');
    document.getElementById('stats-line').textContent =
      parts.length ? parts.join(' \u00B7 ') : 'An endless stream of knowledge from across the web';
  }
};

// ═══════════════════════════════════════════════════
// Engagement Tracker — naive preference algorithm
// ═══════════════════════════════════════════════════
const engagement = {
  weights: { wiki: 1, trivia: 1, numbers: 1, countries: 1, space: 1 },

  load() {
    const w = safeGet(SKEYS.ENGAGEMENT, null);
    if (w) this.weights = w;
  },

  // Boost a category when the user engages with it
  track(type, action) {
    const boost = action === 'bookmark' ? 0.3
      : action === 'trivia_correct' ? 0.2
      : action === 'click' ? 0.15
      : 0.03; // view
    this.weights[type] = Math.min(3, (this.weights[type] || 1) + boost);
    // Gentle decay on others for relative balance
    for (const k in this.weights) {
      if (k !== type) this.weights[k] = Math.max(0.3, this.weights[k] - 0.01);
    }
    this.save();
  },

  // Weighted sort: higher-engagement items float up with randomness for variety
  biasSort(items) {
    return items.sort((a, b) => {
      const wa = (this.weights[a.type] || 1) + Math.random() * 0.6;
      const wb = (this.weights[b.type] || 1) + Math.random() * 0.6;
      return wb - wa;
    });
  },

  save() { safeSet(SKEYS.ENGAGEMENT, this.weights); }
};

// ═══════════════════════════════════════════════════
// Bookmarks
// ═══════════════════════════════════════════════════
const bookmarks = {
  _items: {},   // fp -> item data

  load() { this._items = safeGet(SKEYS.BOOKMARKS, {}); },

  has(fp) { return fp in this._items; },

  toggle(fp, itemData) {
    if (this.has(fp)) {
      delete this._items[fp];
      showToast('Removed from saved', 'info');
    } else if (itemData) {
      this._items[fp] = itemData;
      engagement.track(itemData.type, 'bookmark');
      showToast('Saved!', 'success');
    }
    this.save();
    this._updateCount();
    this._updateButtons(fp);
  },

  count() { return Object.keys(this._items).length; },

  all() { return Object.entries(this._items); },

  save() { safeSet(SKEYS.BOOKMARKS, this._items); },

  _updateCount() {
    document.getElementById('bookmarks-btn').textContent = 'Saved (' + this.count() + ')';
    stats.render();
  },

  _updateButtons(fp) {
    document.querySelectorAll(`.bookmark-btn[data-fp="${CSS.escape(fp)}"]`).forEach(btn => {
      btn.classList.toggle('saved', this.has(fp));
      btn.innerHTML = this.has(fp) ? BOOKMARK_SVG_FILLED : BOOKMARK_SVG_OUTLINE;
    });
  },

  renderDrawer() {
    const list = document.getElementById('bookmarks-list');
    const entries = this.all();
    if (entries.length === 0) {
      list.innerHTML = '<div class="drawer-empty">No saved items yet.<br>Click the bookmark icon on any card to save it.</div>';
      return;
    }
    const typeLabels = { wiki: 'Wikipedia', trivia: 'Trivia', numbers: 'Fact', countries: 'World', space: 'Space' };
    list.innerHTML = entries.map(([fp, item]) => {
      const title = item.title || item.question || item.name || item.text || '';
      const excerpt = item.extract || item.explanation || item.text || '';
      return `<div class="drawer-item" data-fp="${esc(fp)}">
        <button class="drawer-remove" data-fp="${esc(fp)}">&times;</button>
        <div class="drawer-item-badge">${typeLabels[item.type] || item.type}</div>
        <h3>${esc(title.slice(0, 80))}</h3>
        <p>${esc(excerpt.slice(0, 120))}${excerpt.length > 120 ? '\u2026' : ''}</p>
      </div>`;
    }).join('');
  }
};

// ═══════════════════════════════════════════════════
// Session Manager — resume on accidental close
// ═══════════════════════════════════════════════════
const sessionMgr = {
  save() {
    const items = [...cardDataMap.entries()].slice(-SESSION_MAX_ITEMS).map(([fp, d]) => d);
    safeSet(SKEYS.SESSION, {
      feedItems: items,
      scrollY: window.scrollY,
      filters: [...pool.activeKeys],
      totalItems,
      timestamp: Date.now()
    });
  },

  load() {
    const s = safeGet(SKEYS.SESSION, null);
    if (!s || !s.feedItems || s.feedItems.length === 0) return null;
    if (Date.now() - s.timestamp > SESSION_EXPIRE_MS) { this.clear(); return null; }
    return s;
  },

  clear() {
    try { localStorage.removeItem(SKEYS.SESSION); } catch {}
  }
};

// ═══════════════════════════════════════════════════
// Content Sources
// ═══════════════════════════════════════════════════
const sources = {
  wiki: {
    buffer: [], lastFetch: 0, errorUntil: 0,
    async fetch() {
      const items = [];
      const fetches = Array.from({ length: 3 }, () =>
        fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary')
          .then(r => r.json()).catch(() => null)
      );
      for (const d of await Promise.all(fetches)) {
        if (!d || !d.title || d.type === 'disambiguation') continue;
        items.push({
          type: 'wiki', title: d.title, extract: d.extract || '',
          thumbnail: d.thumbnail ? d.thumbnail.source : null,
          url: d.content_urls ? d.content_urls.desktop.page : null,
          description: d.description || ''
        });
      }
      return items;
    }
  },

  trivia: {
    buffer: [], lastFetch: 0, errorUntil: 0, token: null,
    async fetch() {
      if (!this.token) {
        try {
          const r = await fetch('https://opentdb.com/api_token.php?command=request');
          const d = await r.json();
          if (d.response_code === 0) this.token = d.token;
        } catch {}
      }
      let url = 'https://opentdb.com/api.php?amount=10&type=multiple';
      if (this.token) url += '&token=' + this.token;
      const r = await fetch(url);
      const d = await r.json();
      if (d.response_code === 4 && this.token) {
        await fetch('https://opentdb.com/api_token.php?command=reset&token=' + this.token).catch(() => {});
        this.token = null;
      }
      if (!d.results) return [];
      return d.results.map(q => ({
        type: 'trivia', question: decodeHTML(q.question),
        correct: decodeHTML(q.correct_answer),
        incorrect: q.incorrect_answers.map(decodeHTML),
        category: q.category, difficulty: q.difficulty
      }));
    }
  },

  numbers: {
    buffer: [], lastFetch: 0, errorUntil: 0,
    async fetch() {
      const items = [];
      const types = ['trivia', 'math', 'year'];
      const fetches = types.map(t => {
        const num = t === 'year' ? Math.floor(Math.random() * 2024)
          : Math.floor(Math.random() * 10000);
        return fetch(`https://numbersapi.com/${num}/${t}?json`).then(r => r.json()).catch(() => null);
      });
      for (const d of await Promise.all(fetches)) {
        if (!d || !d.text) continue;
        items.push({ type: 'numbers', number: d.number, text: d.text, numType: d.type });
      }
      return items;
    }
  },

  countries: {
    buffer: [], lastFetch: 0, errorUntil: 0, allData: null,
    async fetch() {
      if (!this.allData) {
        const r = await fetch('https://restcountries.com/v3.1/all?fields=name,capital,population,region,flags,languages,currencies,area');
        this.allData = await r.json();
      }
      return shuffle([...this.allData]).slice(0, 5).map(c => ({
        type: 'countries', name: c.name.common, official: c.name.official,
        capital: c.capital ? c.capital[0] : '\u2014', population: c.population,
        region: c.region, flag: c.flags ? c.flags.svg : null,
        languages: c.languages ? Object.values(c.languages) : [],
        currencies: c.currencies ? Object.values(c.currencies).map(x => x.name) : [],
        area: c.area
      }));
    }
  },

  space: {
    buffer: [], lastFetch: 0, errorUntil: 0,
    async fetch() {
      const r = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&count=3');
      const data = await r.json();
      if (!Array.isArray(data)) return [];
      return data.filter(d => d.media_type === 'image').map(d => ({
        type: 'space', title: d.title, explanation: d.explanation, url: d.url, date: d.date
      }));
    }
  }
};

// ═══════════════════════════════════════════════════
// Content Pool — with dedup + engagement bias
// ═══════════════════════════════════════════════════
const pool = {
  items: [],
  activeKeys: new Set(['wiki', 'trivia', 'numbers', 'countries', 'space']),
  filling: false,

  async refill() {
    if (this.filling) return;
    this.filling = true;
    const now = Date.now();
    const keys = [...this.activeKeys].filter(k => {
      const s = sources[k];
      if (s.buffer.length > 0) return false;
      if (now < s.errorUntil) return false;
      if (now - s.lastFetch < SOURCE_COOLDOWN) return false;
      return true;
    });

    await Promise.allSettled(keys.map(async k => {
      const s = sources[k];
      s.lastFetch = Date.now();
      try {
        const items = await s.fetch();
        s.buffer.push(...items);
      } catch (err) {
        s.errorUntil = Date.now() + ERROR_COOLDOWN;
        console.warn(`[${k}] fetch failed:`, err.message);
      }
    }));

    for (const k of this.activeKeys) {
      const s = sources[k];
      if (s.buffer.length > 0) this.items.push(...s.buffer.splice(0));
    }

    // Dedup: remove items already seen
    this.items = this.items.filter(item => !seen.has(fingerprint(item)));
    // Bias toward engaged categories
    engagement.biasSort(this.items);
    this.filling = false;
  },

  async next(count) {
    if (this.items.length < count) await this.refill();
    if (this.items.length === 0) await this.refill();
    const out = this.items.splice(0, count);

    // Mark served items as seen
    for (const item of out) seen.add(fingerprint(item));
    seen.save();

    if (this.items.length < REFILL_THRESHOLD) this.refill();
    return out;
  }
};

// ═══════════════════════════════════════════════════
// Card Rendering
// ═══════════════════════════════════════════════════
const cardDataMap = new Map(); // fp -> item

function renderCard(item, restored) {
  const fp = fingerprint(item);
  cardDataMap.set(fp, item);

  const card = document.createElement('article');
  card.className = 'card ' + item.type + '-card' + (restored ? ' restored' : '');
  card.dataset.fp = fp;
  card.dataset.type = item.type;

  const renderers = { wiki: renderWiki, trivia: renderTrivia, numbers: renderNumbers, countries: renderCountry, space: renderSpace };
  const render = renderers[item.type];
  if (!render) return null;

  const isSaved = bookmarks.has(fp);
  const bmBtn = `<button class="bookmark-btn${isSaved ? ' saved' : ''}" data-fp="${esc(fp)}" title="Save">${isSaved ? BOOKMARK_SVG_FILLED : BOOKMARK_SVG_OUTLINE}</button>`;

  card.innerHTML = bmBtn + render(item);
  return card;
}

function renderWiki(d) {
  const img = d.thumbnail ? `<img class="wiki-thumbnail" src="${d.thumbnail}" alt="${esc(d.title)}" loading="lazy" onerror="this.remove()">` : '';
  const extract = d.extract.length > 320 ? d.extract.slice(0, 320) + '\u2026' : d.extract;
  return `<div class="card-accent"></div>${img}
    <div class="card-badge">Wikipedia</div>
    <div class="card-body">
      ${d.description ? `<p class="wiki-description">${esc(d.description)}</p>` : ''}
      <h2>${esc(d.title)}</h2>
      <p>${esc(extract)}</p>
      ${d.url ? `<a class="card-link" href="${d.url}" target="_blank" rel="noopener">Read full article &rarr;</a>` : ''}
    </div>`;
}

function renderTrivia(d) {
  const options = shuffle([...d.incorrect, d.correct]);
  const diffDots = d.difficulty === 'easy' ? '\u25CF\u25CB\u25CB' : d.difficulty === 'medium' ? '\u25CF\u25CF\u25CB' : '\u25CF\u25CF\u25CF';
  return `<div class="card-accent"></div>
    <div class="card-badge">Trivia</div>
    <div class="card-body">
      <div class="trivia-meta">
        <span class="trivia-category">${esc(d.category)}</span>
        <span class="trivia-difficulty">${diffDots} ${esc(d.difficulty)}</span>
      </div>
      <p class="trivia-question">${esc(d.question)}</p>
      <div class="trivia-options" data-correct="${esc(d.correct)}">
        ${options.map(o => `<button class="trivia-option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}
      </div>
    </div>`;
}

function renderNumbers(d) {
  const label = d.numType === 'math' ? 'Math Fact' : d.numType === 'year' ? 'Year in History' : 'Number Fact';
  return `<div class="card-accent"></div>
    <div class="card-badge">${label}</div>
    <div class="card-body">
      <div class="number-display">${esc(String(d.number))}</div>
      <p>${esc(d.text)}</p>
    </div>`;
}

function renderCountry(d) {
  const flagImg = d.flag ? `<img class="country-flag" src="${d.flag}" alt="Flag of ${esc(d.name)}" loading="lazy" onerror="this.remove()">` : '';
  return `<div class="card-accent"></div>
    <div class="card-badge">World</div>
    <div class="card-body">
      <div class="country-header">${flagImg}<div><h2>${esc(d.name)}</h2></div></div>
      <div class="country-facts">
        <div class="country-fact"><strong>Capital</strong>${esc(d.capital)}</div>
        <div class="country-fact"><strong>Population</strong>${formatPop(d.population)}</div>
        <div class="country-fact"><strong>Region</strong>${esc(d.region)}</div>
        <div class="country-fact"><strong>Area</strong>${formatArea(d.area)}</div>
        <div class="country-fact"><strong>Languages</strong>${esc(d.languages.slice(0, 3).join(', ') || '\u2014')}</div>
        <div class="country-fact"><strong>Currency</strong>${esc(d.currencies.slice(0, 2).join(', ') || '\u2014')}</div>
      </div>
    </div>`;
}

function renderSpace(d) {
  const explanation = d.explanation || '';
  const truncated = explanation.length > 250;
  return `<div class="card-accent"></div>
    <img class="space-image" src="${d.url}" alt="${esc(d.title)}" loading="lazy" onerror="this.remove()">
    <div class="card-badge">Space</div>
    <div class="card-body">
      <h2>${esc(d.title)}</h2>
      <p class="space-explanation${truncated ? '' : ' expanded'}">${esc(explanation)}</p>
      ${truncated ? '<button class="show-more-btn">Show more</button>' : ''}
      <span class="space-date">${esc(d.date)}</span>
    </div>`;
}

// ═══════════════════════════════════════════════════
// Visibility Observer — track what user actually reads
// ═══════════════════════════════════════════════════
const visObserver = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    const card = entry.target;
    if (card.dataset.viewed) continue;
    card.dataset.viewed = '1';
    const type = card.dataset.type;
    if (type) {
      engagement.track(type, 'view');
      stats.recordView();
    }
  }
}, { threshold: 0.5 });

// Scroll Controller
// ═══════════════════════════════════════════════════
const feed = document.getElementById('feed');
const loader = document.getElementById('loader');
const counterEl = document.getElementById('counter');
const sentinel = document.getElementById('sentinel');
const scrollTopBtn = document.getElementById('scroll-top');
let loading = false;
let totalItems = 0;

function appendCards(items, restored) {
  items.forEach((item, i) => {
    const card = renderCard(item, restored);
    if (card) {
      if (!restored) card.style.animationDelay = `${i * 0.08}s`;
      feed.appendChild(card);
      visObserver.observe(card);
      totalItems++;
    }
  });
  counterEl.textContent = totalItems + ' things learned';
  stats.render();
}

async function loadMore() {
  if (loading) return;
  if (pool.activeKeys.size === 0) {
    feed.innerHTML = '<div class="empty-state"><div class="icon">?</div><p>Select at least one topic above to start learning!</p></div>';
    loader.classList.add('hidden');
    return;
  }

  loading = true;
  loader.classList.remove('hidden');

  const items = await pool.next(BATCH_SIZE);

  if (items.length === 0) {
    showToast('Having trouble fetching content. Retrying\u2026');
    loading = false;
    setTimeout(loadMore, 5000);
    return;
  }

  const emptyState = feed.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  appendCards(items, false);

  loader.classList.add('hidden');
  loading = false;

  // Persist session after each batch
  sessionMgr.save();
  stats.save();
}

// Infinite scroll trigger
const scrollObserver = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && !loading) loadMore();
}, { rootMargin: '300px' });

scrollObserver.observe(sentinel);

// ═══════════════════════════════════════════════════
// Keyboard Shortcuts — j/k navigate, b bookmark
// ═══════════════════════════════════════════════════
function getCurrentCard() {
  const cards = feed.querySelectorAll('.card');
  const midY = window.innerHeight / 2;
  let closest = null, closestDist = Infinity;
  for (const card of cards) {
    const rect = card.getBoundingClientRect();
    const dist = Math.abs(rect.top + rect.height / 2 - midY);
    if (dist < closestDist) { closestDist = dist; closest = card; }
  }
  return closest;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;

  if (e.key === 'j' || (e.key === 'ArrowDown' && !e.altKey)) {
    e.preventDefault();
    const cur = getCurrentCard();
    const next = cur && cur.nextElementSibling;
    if (next && next.classList.contains('card')) {
      next.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  if (e.key === 'k' || (e.key === 'ArrowUp' && !e.altKey)) {
    e.preventDefault();
    const cur = getCurrentCard();
    const prev = cur && cur.previousElementSibling;
    if (prev && prev.classList.contains('card')) {
      prev.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  if (e.key === 'b') {
    const cur = getCurrentCard();
    if (cur) {
      const fp = cur.dataset.fp;
      bookmarks.toggle(fp, cardDataMap.get(fp));
    }
  }

  if (e.key === 'Escape') closeDrawer();
});

window.addEventListener('scroll', () => {

  if (window.scrollY > 400) {

    hint.classList.add('visible');
    setTimeout(() => hint.classList.remove('visible'), 5000);

}, { passive: true });

// ═══════════════════════════════════════════════════
// Initialize
// ═══════════════════════════════════════════════════
(function init() {
  // Load persisted state
  seen.load();
  stats.load();
  engagement.load();
  bookmarks.load();
  bookmarks._updateCount();

  // Restore filter state
  const savedFilters = safeGet(SKEYS.FILTERS, null);
  if (savedFilters) {
    pool.activeKeys = new Set(savedFilters);
    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
      btn.classList.toggle('active', pool.activeKeys.has(btn.dataset.filter));
    });
  }

  stats.render();

  // Pre-fetch countries data
  sources.countries.fetch().catch(() => {});

  // Check for saved session
  const saved = sessionMgr.load();
  if (saved && saved.feedItems.length > 0) {
    const banner = document.getElementById('resume-banner');
    banner.classList.remove('hidden');
    banner.innerHTML = `
      <p>Welcome back! You had <strong>${saved.feedItems.length} items</strong> in your feed (${timeAgo(saved.timestamp)}).</p>
      <div class="resume-actions">
        <button class="primary" id="resume-yes">Resume</button>
        <button id="resume-no">Start Fresh</button>
      </div>`;

    document.getElementById('resume-yes').addEventListener('click', () => {
      banner.classList.add('hidden');
      // Restore saved feed items
      appendCards(saved.feedItems, true);
      totalItems = saved.feedItems.length;
      // Scroll to previous position on next frame
      requestAnimationFrame(() => {
        window.scrollTo(0, saved.scrollY || 0);
      });
      // Add divider, then continue loading new content
      const divider = document.createElement('div');
      divider.className = 'session-divider';
      divider.textContent = 'New content below';
      feed.appendChild(divider);
    });

    document.getElementById('resume-no').addEventListener('click', () => {
      banner.classList.add('hidden');
      sessionMgr.clear();
      loadMore();
    });
  } else {
    loadMore();
  }
})();
</script>
</body>
</html>
