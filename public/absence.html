<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="unrendered:line" content="The page is not empty where it is silent.">
  <meta name="unrendered:line" content="A comment is a room the renderer walks past.">
  <meta name="unrendered:line" content="Templates are futures refusing the present.">
  <meta name="unrendered:line" content="Hidden inputs are small sealed instructions.">
  <meta name="unrendered:line" content="Negation is not absence. It is a boundary with memory.">
  <title>Unrendered Atlas</title>
  <style>
    :root {
      --bg: #080a0c;
      --ink: #f3efe4;
      --muted: #8a918f;
      --line: rgba(243, 239, 228, 0.16);
      --panel: rgba(16, 19, 21, 0.78);
      --comment: #8bd3ff;
      --meta: #f0c36a;
      --template: #a8e06d;
      --hidden: #ff8f70;
      --script: #c6a5ff;
      --noscript: #f36f91;
      --focus: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
      isolation: isolate;
    }

    .shell::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(243, 239, 228, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 239, 228, 0.035) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at 50% 45%, black 0, transparent 74%);
      z-index: -2;
    }

    .shell::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8, 10, 12, 0.2), rgba(8, 10, 12, 0.9)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.018), rgba(255,255,255,0.018) 1px, transparent 1px, transparent 5px);
      z-index: -1;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 22px clamp(16px, 4vw, 48px) 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 10, 12, 0.78);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2.4vw, 2.1rem);
      font-weight: 700;
      line-height: 1.05;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.82rem;
      max-width: 68ch;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .control {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--line);
      min-height: 36px;
      padding: 0 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    .control:hover,
    .control[aria-pressed="true"] {
      border-color: rgba(255, 255, 255, 0.44);
      background: rgba(255, 255, 255, 0.11);
    }

    .negate {
      min-height: 36px;
      width: min(28vw, 240px);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
      padding: 0 11px;
      outline: none;
    }

    .negate:focus {
      border-color: rgba(255, 255, 255, 0.56);
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
    }

    .stage {
      min-width: 0;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--line);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 420px;
    }

    .lens {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      opacity: 0.72;
    }

    .lens::before,
    .lens::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.42);
    }

    .lens::before {
      width: 100%;
      height: 1px;
    }

    .lens::after {
      width: 1px;
      height: 100%;
    }

    .readout {
      position: absolute;
      left: clamp(14px, 3vw, 36px);
      bottom: clamp(14px, 3vw, 36px);
      width: min(720px, calc(100% - 28px));
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--ink);
      text-shadow: 0 1px 20px rgba(0, 0, 0, 0.8);
    }

    .readout-kicker {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
    }

    .readout-line {
      margin-top: 8px;
      font-size: clamp(1rem, 2.2vw, 1.7rem);
      line-height: 1.25;
      max-width: 34ch;
    }

    aside {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--panel);
      backdrop-filter: blur(16px);
    }

    .ledger-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .count-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .count {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px;
    }

    .count strong {
      display: block;
      font-size: 1.15rem;
    }

    .count span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ledger {
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }

    .entry {
      border: 1px solid transparent;
      border-bottom-color: var(--line);
      display: grid;
      gap: 8px;
      padding: 12px 8px;
      color: rgba(243, 239, 228, 0.82);
      cursor: pointer;
    }

    .entry:hover,
    .entry.active {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.055);
    }

    .entry-type {
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .entry-text {
      font-size: 0.82rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px clamp(16px, 4vw, 48px);
      font-size: 0.74rem;
      background: rgba(8, 10, 12, 0.82);
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .shell {
        min-height: 100svh;
      }

      header {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .controls {
        justify-content: flex-start;
      }

      .negate {
        width: min(100%, 360px);
      }

      main {
        grid-template-columns: 1fr;
      }

      .stage {
        height: 62svh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      canvas {
        min-height: 360px;
      }

      aside {
        height: 42svh;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- The first material is a refusal to become visible. -->
  <!-- Between tags, the browser keeps a ledger of things it owes no pixels. -->
  <!-- The atlas is not signed. It is subtracted into being. -->
  <!-- Every rendered surface stands on a quiet landfill of unrendered intention. -->
  <!-- This comment is not decoration. It is a coordinate. -->

  <div class="shell">
    <header>
      <div>
        <h1>Unrendered Atlas</h1>
        <div class="subtitle">A document made from what the document usually withholds.</div>
      </div>
      <div class="controls" aria-label="Atlas controls">
        <button class="control" data-mode="all" aria-pressed="true">all</button>
        <button class="control" data-mode="comment" aria-pressed="false">/* */</button>
        <button class="control" data-mode="meta" aria-pressed="false">meta</button>
        <button class="control" data-mode="template" aria-pressed="false">template</button>
        <button class="control" data-mode="hidden" aria-pressed="false">hidden</button>
        <input class="negate" id="negate" autocomplete="off" spellcheck="false" placeholder="negate">
      </div>
    </header>

    <main>
      <section class="stage" aria-label="Unrendered atlas">
        <canvas id="atlas"></canvas>
        <div class="lens" id="lens" aria-hidden="true"></div>
        <div class="readout">
          <div class="readout-kicker" id="readoutType">source</div>
          <div class="readout-line" id="readoutLine">moving through quiet markup</div>
        </div>
      </section>

      <aside aria-label="Extracted ledger">
        <div class="ledger-head">
          <div class="count-row">
            <div class="count"><strong id="visibleCount">0</strong><span>visible</span></div>
            <div class="count"><strong id="sourceCount">0</strong><span>sources</span></div>
            <div class="count"><strong id="voidMass">0</strong><span>void mass</span></div>
          </div>
        </div>
        <div class="ledger" id="ledger"></div>
      </aside>
    </main>

    <footer>
      <span>no dice thrown</span>
      <span>what is withheld still has coordinates</span>
    </footer>
  </div>

  <template id="latent-phrases">
    <p data-tone="edge">The strongest part of a page may be the part that cannot be clicked.</p>
    <p data-tone="edge">A template is a promise with no appointment.</p>
    <p data-tone="edge">HTML has attics: inert trees, dead scripts, private names, quiet attributes.</p>
    <p data-tone="edge">The renderer says no. The document still says yes.</p>
    <p data-tone="edge">A hidden field is a door without a handle.</p>
  </template>

  <input type="hidden" data-unrendered value="Nothing here is random. The arrangement comes from the bytes already present.">
  <input type="hidden" data-unrendered value="A page can remember without displaying the memory.">
  <input type="hidden" data-unrendered value="The interface is a treaty between omission and attention.">

  <script id="silent-chamber" type="application/x-unrendered">
    The browser will not run this.
    That is why it can speak plainly.
    A non-executing script is a sealed room wearing a script tag as camouflage.
  </script>

  <noscript>
    If script is absent, the atlas collapses back into the ordinary page.
    The hidden material remains, but no witness assembles it.
  </noscript>

  <script>
    (() => {
      const canvas = document.getElementById("atlas");
      const ctx = canvas.getContext("2d");
      const lens = document.getElementById("lens");
      const ledger = document.getElementById("ledger");
      const readoutType = document.getElementById("readoutType");
      const readoutLine = document.getElementById("readoutLine");
      const visibleCount = document.getElementById("visibleCount");
      const sourceCount = document.getElementById("sourceCount");
      const voidMass = document.getElementById("voidMass");
      const negateInput = document.getElementById("negate");
      const buttons = Array.from(document.querySelectorAll(".control"));
      const colors = {
        comment: getCss("--comment"),
        meta: getCss("--meta"),
        template: getCss("--template"),
        hidden: getCss("--hidden"),
        script: getCss("--script"),
        noscript: getCss("--noscript")
      };

      let mode = "all";
      let pointer = { x: 0, y: 0, active: false };
      let activeId = null;
      let entries = collectEntries();
      let visible = [];
      let width = 0;
      let height = 0;
      let dpr = 1;

      function getCss(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function cleanText(text) {
        return String(text).replace(/\s+/g, " ").trim();
      }

      function collectEntries() {
        const out = [];
        let index = 0;

        const walker = document.createNodeIterator(document, NodeFilter.SHOW_COMMENT);
        let comment;
        while ((comment = walker.nextNode())) {
          add("comment", comment.nodeValue);
        }

        document.querySelectorAll('meta[name="unrendered:line"]').forEach((meta) => {
          add("meta", meta.content);
        });

        document.querySelectorAll("template").forEach((template) => {
          template.content.querySelectorAll("[data-tone], p, li").forEach((node) => {
            add("template", node.textContent);
          });
        });

        document.querySelectorAll('input[type="hidden"][data-unrendered]').forEach((input) => {
          add("hidden", input.value);
        });

        document.querySelectorAll('script[type="application/x-unrendered"]').forEach((script) => {
          add("script", script.textContent);
        });

        document.querySelectorAll("noscript").forEach((node) => {
          add("noscript", node.textContent);
        });

        function add(type, raw) {
          const text = cleanText(raw);
          if (!text) return;
          const hash = hashText(type + ":" + text + ":" + index);
          out.push({
            id: index++,
            type,
            text,
            hash,
            color: colors[type] || "#ffffff",
            mass: text.length
          });
        }

        return out;
      }

      function hashText(text) {
        let h = 2166136261;
        for (let i = 0; i < text.length; i++) {
          h ^= text.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function unit(hash, salt) {
        const mixed = hashText(hash + ":" + salt);
        return mixed / 4294967295;
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, Math.floor(rect.width));
        height = Math.max(1, Math.floor(rect.height));
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        placeEntries();
      }

      function placeEntries() {
        entries.forEach((entry) => {
          const ring = 0.18 + unit(entry.hash, "ring") * 0.68;
          const angle = unit(entry.hash, "angle") * Math.PI * 2;
          const wobble = 0.76 + unit(entry.hash, "wobble") * 0.22;
          entry.x = width * 0.5 + Math.cos(angle) * width * ring * 0.44 * wobble;
          entry.y = height * 0.5 + Math.sin(angle) * height * ring * 0.44;
          entry.r = 3 + Math.min(18, Math.sqrt(entry.mass) * 0.9);
          entry.phase = unit(entry.hash, "phase") * Math.PI * 2;
          entry.speed = 0.00015 + unit(entry.hash, "speed") * 0.00028;
        });
        applyFilters();
      }

      function applyFilters() {
        const negation = cleanText(negateInput.value).toLowerCase();
        visible = entries.filter((entry) => {
          if (mode !== "all" && entry.type !== mode) return false;
          if (negation && entry.text.toLowerCase().includes(negation)) return false;
          return true;
        });
        renderLedger();
        sourceCount.textContent = String(new Set(visible.map((entry) => entry.type)).size);
        visibleCount.textContent = String(visible.length);
        voidMass.textContent = String(visible.reduce((sum, entry) => sum + entry.mass, 0));
      }

      function renderLedger() {
        ledger.innerHTML = "";
        visible.forEach((entry) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "entry";
          row.dataset.id = entry.id;
          row.innerHTML = '<span class="entry-type"></span><span class="entry-text"></span>';
          row.querySelector(".entry-type").textContent = entry.type;
          row.querySelector(".entry-type").style.color = entry.color;
          row.querySelector(".entry-text").textContent = entry.text;
          row.addEventListener("mouseenter", () => setActive(entry));
          row.addEventListener("focus", () => setActive(entry));
          row.addEventListener("click", () => setActive(entry));
          ledger.appendChild(row);
        });
      }

      function setActive(entry) {
        activeId = entry.id;
        readoutType.textContent = entry.type;
        readoutType.style.color = entry.color;
        readoutLine.textContent = entry.text;
        document.querySelectorAll(".entry").forEach((row) => {
          row.classList.toggle("active", Number(row.dataset.id) === entry.id);
        });
      }

      function nearestEntry() {
        if (!pointer.active || !visible.length) return null;
        let best = null;
        let bestDistance = Infinity;
        for (const entry of visible) {
          const drift = driftFor(entry, performance.now());
          const dx = pointer.x - drift.x;
          const dy = pointer.y - drift.y;
          const dist = Math.hypot(dx, dy);
          if (dist < bestDistance) {
            bestDistance = dist;
            best = entry;
          }
        }
        return bestDistance < 140 ? best : null;
      }

      function driftFor(entry, time) {
        const t = time * entry.speed + entry.phase;
        return {
          x: entry.x + Math.cos(t) * 18,
          y: entry.y + Math.sin(t * 1.7) * 14
        };
      }

      function draw(time) {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#080a0c";
        ctx.fillRect(0, 0, width, height);

        drawAxes();

        for (let i = 0; i < visible.length; i++) {
          const entry = visible[i];
          const pos = driftFor(entry, time);
          const focus = entry.id === activeId;
          const nearPointer = pointer.active && Math.hypot(pointer.x - pos.x, pointer.y - pos.y) < 130;
          drawEntry(entry, pos, focus || nearPointer, time);

          for (let j = i + 1; j < visible.length; j++) {
            const other = visible[j];
            if (entry.type !== other.type) continue;
            const otherPos = driftFor(other, time);
            const dist = Math.hypot(pos.x - otherPos.x, pos.y - otherPos.y);
            if (dist < 170) {
              ctx.globalAlpha = (1 - dist / 170) * 0.18;
              ctx.strokeStyle = entry.color;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(pos.x, pos.y);
              ctx.lineTo(otherPos.x, otherPos.y);
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }
        }

        const nearest = nearestEntry();
        if (nearest && nearest.id !== activeId) setActive(nearest);

        requestAnimationFrame(draw);
      }

      function drawAxes() {
        ctx.strokeStyle = "rgba(243, 239, 228, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(width * 0.5, 0);
        ctx.lineTo(width * 0.5, height);
        ctx.moveTo(0, height * 0.5);
        ctx.lineTo(width, height * 0.5);
        ctx.stroke();

        ctx.strokeStyle = "rgba(243, 239, 228, 0.05)";
        for (let r = 80; r < Math.max(width, height); r += 92) {
          ctx.beginPath();
          ctx.ellipse(width * 0.5, height * 0.5, r, r * 0.62, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawEntry(entry, pos, focus, time) {
        const pulse = 1 + Math.sin(time * 0.002 + entry.phase) * 0.12;
        const radius = entry.r * pulse * (focus ? 1.45 : 1);
        ctx.globalAlpha = focus ? 0.96 : 0.72;
        ctx.fillStyle = entry.color;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = focus ? 0.36 : 0.12;
        ctx.strokeStyle = entry.color;
        ctx.lineWidth = focus ? 2 : 1;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius + 11, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;

        if (focus) {
          ctx.fillStyle = "rgba(255,255,255,0.92)";
          ctx.font = "12px ui-monospace, monospace";
          ctx.fillText(entry.type + " " + entry.id, pos.x + radius + 12, pos.y + 4);
        }
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          mode = button.dataset.mode;
          buttons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
          activeId = null;
          applyFilters();
        });
      });

      negateInput.addEventListener("input", () => {
        activeId = null;
        applyFilters();
      });

      canvas.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        pointer = {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
          active: true
        };
        lens.style.left = pointer.x + "px";
        lens.style.top = pointer.y + "px";
      });

      canvas.addEventListener("pointerleave", () => {
        pointer.active = false;
      });

      window.addEventListener("resize", resize);
      resize();
      if (visible[0]) setActive(visible[0]);
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
