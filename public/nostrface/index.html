<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Steganography Fun</title>
    <style>
        :root { --bg: #000; --fg: #0f0; --accent: #0f0; --panel: #111; }
        body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* HEADER */
        header { padding: 10px 20px; background: var(--panel); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 14px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 5px var(--accent); }
        .stats { font-size: 11px; opacity: 0.6; }

        /* MAIN STAGE */
        .stage { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1a1a1a 0%, #000 80%); }
        canvas { position: absolute; width: 100%; height: 100%; }
        video { position: absolute; opacity: 0; pointer-events: none; }

        /* CONTROLS */
        .controls { background: var(--panel); padding: 15px; border-top: 1px solid #222; z-index: 10; }
        .timeline-container { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        input[type=range] { flex-grow: 1; accent-color: var(--accent); cursor: pointer; height: 4px; background: #333; }
        
        .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button {
            background: #000; border: 1px solid #444; color: #fff; padding: 8px 12px; 
            font-family: inherit; font-size: 10px; cursor: pointer; text-transform: uppercase; font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(0,255,0,0.2); }
        button.active { background: var(--accent); color: #000; border-color: var(--accent); }
        button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; }
        
        /* HIDDEN ELEMENTS FOR IO */
        #fileInput { display: none; }
        #dropZone { border: 2px dashed #444; padding: 10px; text-align: center; cursor: pointer; font-size: 10px; color: #666; transition: border-color 0.2s; }
        #dropZone:hover { border-color: #0f0; }
        #loading { position: absolute; color: var(--accent); animation: blink 0.5s infinite alternate; pointer-events: none; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

    </style>
</head>
<body>

<header>
    <h1>Steganography Fun</h1>
    <div class="stats" id="stats">READY</div>
</header>

<div class="stage">
    <div id="loading">INITIALIZING OPTICAL NEURAL LINK...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div class="controls">
    <div class="timeline-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="scrubber" min="0" max="0" value="0" disabled>
        <span id="totalTime">0:00</span>
    </div>
    
    <div class="btn-row">
        <button id="recBtn" disabled>● REC</button>
        <button id="playPauseBtn" disabled>▶ PLAY</button>
        <button id="cameraBtn">CAMERA: OFF</button>
        
        <div style="width: 1px; height: 20px; background: #333; margin: 0 5px;"></div>
        
        <button id="synthBtn">SOUND: OFF</button>
        
        <div style="width: 1px; height: 20px; background: #333; margin: 0 5px;"></div>

        <button id="saveImgBtn" disabled>⇩ SAVE IMG</button>
        
        
        <div style="flex-grow:1"></div>
        <div id="dropZone">DROP IMAGE HERE OR CLICK TO BROWSE</div>
        <input type="file" id="fileInput" accept="image/png">
        <div style="font-size: 10px; color: #666;">MODE: <span id="modeDisplay">LIVE</span></div>
        <button id="speedBtn">SPEED: 1x</button>
        <input type="number" id="speedInput" min="0.1" max="10" step="0.1" value="1" style="width: 50px; font-size: 10px;">
    </div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "./vision_bundle.mjs";

// --- CONFIG ---
const RECORD_STRIDE = 1; // Record every point
const QUANTIZATION = 1000; // Int scaler
const CONFIG = { landmarkSampleRate: 1 };

// --- STATE ---
let faceLandmarker;
let video = document.getElementById("webcam");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let scrubber = document.getElementById("scrubber");

let isRecording = false;
let isPlaying = false;
let recordedFrames = [];
let playbackData = [];
let lastTime = -1;
let mode = "LIVE";
let cameraOn = false;
let playbackSpeed = 1;
let playbackPosition = 0;

// Audio State
let audioCtx = null;
let oscillator = null;
let gainNode = null;
let filterNode = null;
let isSynthActive = false;

// --- INIT ---
async function init() {
    const filesetResolver = await FilesetResolver.forVisionTasks("./");
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { modelAssetPath: `./face_landmarker.task`, delegate: "GPU" },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1
    });

    startLoop();
}

// --- CAMERA CONTROL ---
function startCamera() {
    if (cameraOn) return;
    navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
            document.getElementById("loading").style.display = "none";
            document.getElementById("recBtn").disabled = false;
            cameraOn = true;
            updateCameraBtn();
            mode = "LIVE";
            document.getElementById("modeDisplay").innerText = mode;
            // Reset playback state for fresh camera run
            isPlaying = false;
            updatePlayBtn();
            document.getElementById("playPauseBtn").disabled = true;
            document.getElementById("scrubber").disabled = true;
            scrubber.value = 0;
            updateTimeDisplay();
            // Silence any previous audio
            if(gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        });
    }).catch(err => {
        alert("Camera access denied or unavailable.");
    });
}

function stopCamera() {
    if (!cameraOn) return;
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }
    cameraOn = false;
    updateCameraBtn();
    mode = playbackData.length > 0 ? "PLAY" : "LIVE";
    document.getElementById("modeDisplay").innerText = mode;
    document.getElementById("recBtn").disabled = true;
    if (mode === "PLAY") {
        setupPlayback();
    }
}

function updateCameraBtn() {
    const btn = document.getElementById("cameraBtn");
    btn.innerText = cameraOn ? "CAMERA: ON" : "CAMERA: OFF";
    btn.classList.toggle("active", cameraOn);
}

// --- AUDIO ENGINE (EMO-SYNTH) ---
function initAudio() {
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    oscillator = audioCtx.createOscillator();
    oscillator.type = 'sawtooth';
    
    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.Q.value = 5; // Resonance
    
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0; // Start silent

    // Chain: Osc -> Filter -> Gain -> Out
    oscillator.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
}

function updateSynth(landmarks, blendshapes) {
    if(!isSynthActive || !audioCtx) return;

    const bs = blendshapes || {};

    // Use blendshapes for audio control
    const jaw = bs.jawOpen || 0;
    const smile = ((bs.mouthSmileLeft || 0) + (bs.mouthSmileRight || 0)) / 2;
    const browRaise = ((bs.browInnerUpL || 0) + (bs.browInnerUpR || 0)) / 2;

    // Map to Audio Params
    let pitch = 100 + (browRaise * 2000) + (smile * 500);
    oscillator.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.1);

    let cutoff = 200 + (jaw * 8000);
    filterNode.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.1);

    // Volume acts as a gate (only sound if face is detected)
    gainNode.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.1);
}

// --- RENDER LOOP ---
function startLoop() {
    function frame() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        
        if (mode === "LIVE" || mode === "REC") processLiveVideo();
        else if (mode === "PLAY") processPlayback();
        
        requestAnimationFrame(frame);
    }
    frame();
}

function processLiveVideo() {
    let now = performance.now();
    if (video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        let results = faceLandmarker.detectForVideo(video, now);
        
        if (results.faceLandmarks.length > 0) {
            let landmarks = results.faceLandmarks[0];
            let blendshapes = results.faceBlendshapes ? results.faceBlendshapes[0] : {};
            
            // Draw Face (Front View)
            drawFace(landmarks, blendshapes, isRecording ? "#f00" : "#0f0");
            
            // Audio
            updateSynth(landmarks, blendshapes);

            // Record
            if (isRecording) {
                let frameData = {
                    landmarks: [],
                    blendshapes: blendshapes
                };
                for(let i=0; i<landmarks.length; i+=RECORD_STRIDE) {
                    let p = landmarks[i];
                    frameData.landmarks.push(Math.floor(p.x * QUANTIZATION)); 
                    frameData.landmarks.push(Math.floor(p.y * QUANTIZATION));
                    frameData.landmarks.push(Math.floor(p.z * QUANTIZATION));
                }
                recordedFrames.push(frameData);
                updateStats();
            }
        } else {
            renderGhostFace(ctx, {}, {color: '#0f0'});
            // Silence synth if no face
            if(gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        }
    }
}

function processPlayback() {
    if (!playbackData.length) return;
    
    // Silence synth if paused
    if(!isPlaying && gainNode) {
        gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        renderGhostFace(ctx, {}, {color: '#0ff'});
        return;
    }

    let fIndex = Math.floor(playbackPosition);
    let frameRaw = playbackData[fIndex];

    // Decode
    let points = [];
    let blendshapes = frameRaw.blendshapes || {};
    
    // We need to rebuild the object structure
    for(let i=0; i<frameRaw.landmarks.length; i+=3) {
        let p = {
            x: frameRaw.landmarks[i] / QUANTIZATION,
            y: frameRaw.landmarks[i+1] / QUANTIZATION,
            z: frameRaw.landmarks[i+2] / QUANTIZATION
        };
        points.push(p);
    }
    
    let fullMesh = points; // Reconstruct approximate full mesh for Audio Logic
    // Fill array to avoid index errors in Synth
    while(fullMesh.length < 478) fullMesh.push(fullMesh[0]); 

    drawFace(points, blendshapes, "#0ff");
    updateSynth(fullMesh, blendshapes);

    if (isPlaying) {
        playbackPosition += playbackSpeed;
        if (playbackPosition >= playbackData.length) {
            playbackPosition = 0;
        }
        scrubber.value = Math.floor(playbackPosition);
        updateTimeDisplay();
    }
}

// --- VISUALIZER (FRONT FACING) ---
function renderGhostFace(ctx, faceData, options = {}) {
    const { color = '#0f0', label = '' } = options;
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    
    // Trail effect
    ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
    ctx.fillRect(0, 0, w, h);
    
    if (!faceData?.landmarks?.length) {
        // Waiting animation
        const time = Date.now() / 1000;
        
        ctx.save();
        ctx.globalAlpha = 0.1 + Math.sin(time * 2) * 0.05;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(w/2, h/2, 80 + Math.sin(time) * 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        ctx.fillStyle = '#333';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('👻 Awaiting neural link...', w/2, h/2);
        return;
    }
    
    const landmarks = faceData.landmarks;
    const bs = faceData.blendshapes || {};
    
    // Calculate bounds
    let minX = 1, maxX = 0, minY = 1, maxY = 0;
    landmarks.forEach(p => {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
    });
    
    const faceW = maxX - minX;
    const faceH = maxY - minY;
    const scale = Math.min(w, h) * 0.65 / Math.max(faceW, faceH);
    const offsetX = w/2 - (minX + faceW/2) * scale;
    const offsetY = h/2 - (minY + faceH/2) * scale;
    
    // Dynamic effects based on expression
    const blink = ((bs.eyeBlinkL || 0) + (bs.eyeBlinkR || 0)) / 2;
    const jaw = bs.jawOpen || 0;
    const smile = ((bs.mouthSmileL || 0) + (bs.mouthSmileR || 0)) / 2;
    
    // Color shifts based on expression
    let ghostColor = color;
    if (blink > 0.5) ghostColor = '#fff';
    else if (jaw > 0.3) ghostColor = '#0ff';
    else if (smile > 0.5) ghostColor = '#f0f';
    
    ctx.fillStyle = ghostColor;
    ctx.strokeStyle = ghostColor;
    
    // Draw landmarks as points
    landmarks.forEach((p, i) => {
        let x = p.x * scale + offsetX;
        let y = p.y * scale + offsetY;
        
        // Expression-based distortion
        if (jaw > 0.15) {
            x += (Math.random() - 0.5) * jaw * 12;
            y += (Math.random() - 0.5) * jaw * 12;
        }
        
        // Size based on depth
        const depth = Math.abs(p.z || 0);
        const size = 1.5 + depth * 15;
        
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // Draw connecting mesh lines
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = 0.5;
    
    // Face outline (approximate indices for sampled data)
    const outlineStep = Math.ceil(CONFIG.landmarkSampleRate);
    for (let i = 0; i < landmarks.length - 1; i++) {
        const p1 = landmarks[i];
        const p2 = landmarks[i + 1];
        
        const x1 = p1.x * scale + offsetX;
        const y1 = p1.y * scale + offsetY;
        const x2 = p2.x * scale + offsetX;
        const y2 = p2.y * scale + offsetY;
        
        const dist = Math.hypot(x2 - x1, y2 - y1);
        if (dist < 50) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }
    }
    
    ctx.globalAlpha = 1;
}

function drawFace(landmarks, blendshapes, color) {
    renderGhostFace(ctx, {landmarks, blendshapes}, {color});
}

// --- STEGANOGRAPHY ENGINE ---
function saveToStegoImage() {
    if(recordedFrames.length === 0) return;
    
    const jsonString = JSON.stringify(recordedFrames);
    const dataBytes = new TextEncoder().encode(jsonString);
    const dataLen = dataBytes.length;
    
    if(dataLen > 1000000) {
        alert("Recording too large for steganography. Try shorter recording.");
        return;
    }
    
    // Create a canvas to draw the "Card"
    const stegoCanvas = document.createElement('canvas');
    stegoCanvas.width = 1000;
    stegoCanvas.height = 1000;
    const sCtx = stegoCanvas.getContext('2d');
    
    // 1. Draw Visuals (Background)
    sCtx.fillStyle = "#000";
    sCtx.fillRect(0,0,1000,1000);
    sCtx.fillStyle = "#0f0";
    sCtx.font = "20px Courier New";
    sCtx.fillText("STEG FUN", 20, 40);
    sCtx.fillText(`FRAMES: ${recordedFrames.length}`, 20, 70);
    sCtx.fillText(`SIZE: ${dataLen} BYTES`, 20, 100);
    
    // Draw a snapshot of the face in center
    // We take the middle frame of the recording
    let midFrame = recordedFrames[Math.floor(recordedFrames.length/2)];
    sCtx.fillStyle = "#0f0";
    for(let i=0; i<midFrame.landmarks.length; i+=3) {
        let x = (midFrame.landmarks[i] / QUANTIZATION) * 1000;
        let y = (midFrame.landmarks[i+1] / QUANTIZATION) * 1000;
        sCtx.fillRect((1000-x), y, 2, 2); // Mirror
    }

    // 2. ENCODE DATA INTO PIXELS (Blue Channel Steganography)
    // We get the pixel data
    const imgData = sCtx.getImageData(0, 0, 1000, 1000);
    const pixels = imgData.data;
    
    // Header: Store length in first 4 pixels (32-bit integer split into 4 bytes)
    // We use the Red channel of first 4 pixels for size
    pixels[0] = (dataLen >> 24) & 0xFF;
    pixels[4] = (dataLen >> 16) & 0xFF;
    pixels[8] = (dataLen >> 8) & 0xFF;
    pixels[12] = dataLen & 0xFF;
    
    // Payload: Store data in Blue channel starting at pixel 5
    for(let i = 0; i < dataLen; i++) {
        let pixelIndex = (i + 5) * 4; // *4 for RGBA
        if(pixelIndex >= pixels.length) break; // Overflow protection
        pixels[pixelIndex + 2] = dataBytes[i]; // Blue channel
        // Set Alpha to 255 to ensure visibility/validity
        pixels[pixelIndex + 3] = 255; 
    }
    
    sCtx.putImageData(imgData, 0, 0);
    
    // Download
    const link = document.createElement('a');
    link.download = `steg_fun_${Date.now()}.png`;
    link.href = stegoCanvas.toDataURL();
    link.click();
}

function loadFromStegoImage(file) {
    const img = new Image();
    img.onload = () => {
        const stegoCanvas = document.createElement('canvas');
        stegoCanvas.width = img.width;
        stegoCanvas.height = img.height;
        const sCtx = stegoCanvas.getContext('2d');
        sCtx.drawImage(img, 0, 0);
        
        const imgData = sCtx.getImageData(0, 0, img.width, img.height);
        const pixels = imgData.data;
        
        // Read Header (Length)
        let len = (pixels[0] << 24) | (pixels[4] << 16) | (pixels[8] << 8) | pixels[12];
        
        if(len <= 0 || len > 1000000) { alert("No Steg Data Found or Data Too Large"); return; }
        
        // Read Payload
        const dataBytes = new Uint8Array(len);
        for(let i = 0; i < len; i++) {
            let pixelIndex = (i + 5) * 4;
            dataBytes[i] = pixels[pixelIndex + 2]; // Blue channel
        }
        
        try {
            const jsonString = new TextDecoder().decode(dataBytes);
            playbackData = JSON.parse(jsonString);
            
            mode = "PLAY";
            setupPlayback();
            document.getElementById("modeDisplay").innerText = "PLAY (IMG LOADED)";
            // Auto-play
            isPlaying = true;
            updatePlayBtn();
            document.getElementById("loading").style.display = "none"
        } catch(e) {
            alert("Corrupt Data");
        }
    };
    img.src = URL.createObjectURL(file);
}

// --- UI WIRING ---
document.getElementById("recBtn").onclick = function() {
    if (!cameraOn) {
        alert("Turn on camera to record.");
        return;
    }
    if (!isRecording) {
        isRecording = true;
        recordedFrames = [];
        mode = "REC";
        this.innerText = "■ STOP";
        this.classList.add("active");
        document.getElementById("saveImgBtn").disabled = true;
    } else {
        isRecording = false;
        this.innerText = "● REC";
        this.classList.remove("active");
        playbackData = [...recordedFrames];
        mode = "PLAY";
        setupPlayback();
        document.getElementById("saveImgBtn").disabled = false;
        alert("Recording Complete. Press SAVE IMG to download.");
    }
    document.getElementById("modeDisplay").innerText = mode;
};

document.getElementById("playPauseBtn").onclick = () => {
    isPlaying = !isPlaying;
    updatePlayBtn();
    if(isPlaying && playbackPosition >= playbackData.length - 1) playbackPosition = 0;
};

document.getElementById("synthBtn").onclick = function() {
    isSynthActive = !isSynthActive;
    if(isSynthActive) {
        initAudio(); // Only init on user interaction
        this.innerText = "SOUND: ON";
        this.classList.add("active");
    } else {
        if(gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        this.innerText = "SOUND: OFF";
        this.classList.remove("active");
    }
};

document.getElementById("cameraBtn").onclick = () => {
    if (!cameraOn) {
        startCamera();
    } else {
        stopCamera();
    }
};

document.getElementById("speedBtn").onclick = function() {
    const speeds = [0.5, 1, 2, 4];
    let currentIndex = speeds.indexOf(playbackSpeed);
    if (currentIndex === -1) currentIndex = 1; // default to 1x if custom
    let nextIndex = (currentIndex + 1) % speeds.length;
    playbackSpeed = speeds[nextIndex];
    this.innerText = `SPEED: ${playbackSpeed}x`;
    document.getElementById("speedInput").value = playbackSpeed;
};

document.getElementById("speedInput").oninput = function() {
    playbackSpeed = parseFloat(this.value) || 1;
    document.getElementById("speedBtn").innerText = `SPEED: ${playbackSpeed}x`;
};

document.getElementById("scrubber").oninput = () => { playbackPosition = parseFloat(scrubber.value); isPlaying = false; updatePlayBtn(); updateTimeDisplay(); processPlayback(); };
document.getElementById("saveImgBtn").onclick = saveToStegoImage;
// Drag and drop zone
const dropZone = document.getElementById("dropZone");
dropZone.addEventListener('click', () => document.getElementById("fileInput").click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#0f0'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#444');
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = '#444';
    const files = e.dataTransfer.files;
    if (files.length > 0) loadFromStegoImage(files[0]);
});
document.getElementById("fileInput").onchange = (e) => {
    if(e.target.files.length > 0) loadFromStegoImage(e.target.files[0]);
};

function setupPlayback() {
    document.getElementById("playPauseBtn").disabled = false;
    document.getElementById("scrubber").disabled = false;
    scrubber.max = Math.max(0, playbackData.length - 1);
    scrubber.value = 0;
    playbackPosition = 0;
    isPlaying = false;
    updatePlayBtn();
    updateTimeDisplay();
    updateStats();
    // Reset speed to 1x for new playback
    playbackSpeed = 1;
    document.getElementById("speedBtn").innerText = "SPEED: 1x";
    document.getElementById("speedInput").value = 1;
}

function updatePlayBtn() { document.getElementById("playPauseBtn").innerText = isPlaying ? "|| PAUSE" : "▶ PLAY"; }
function updateTimeDisplay() {
    let sec = Math.floor(scrubber.value / 30);
    document.getElementById("currentTime").innerText = `0:${sec < 10 ? '0'+sec : sec}`;
}
function updateStats() {
    let kb = (JSON.stringify(recordedFrames).length / 1024).toFixed(1);
    document.getElementById("stats").innerText = `${recordedFrames.length} FRAMES // ${kb} KB`;
}

init();

// Auto-load clickme.png if exists
fetch('../clickme.png')
.then(response => {
    if (!response.ok) throw new Error('File not found');
    return response.blob();
})
.then(blob => {
    const file = new File([blob], 'clickme.png', {type: 'image/png'});
    loadFromStegoImage(file);
})
.catch(err => {
    console.log('Auto-load failed:', err);
});

</script>
</body>
</html>
