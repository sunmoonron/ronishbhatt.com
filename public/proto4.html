<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index.html</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #888;
      font: 1.1em/2.4 'Courier New', monospace;
      min-height: 100vh;
      padding: 12vh 10vw;
    }
    .line {
      opacity: 0;
      transform: translateY(8px);
      animation: in 0.6s forwards;
      margin-left: calc(var(--d) * 1.5em);
    }
    @keyframes in { to { opacity: 1; transform: none; } }
    .cursor {
      display: inline-block;
      width: 10px; height: 1.1em;
      background: #444;
      animation: blink 1s infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="out"></div>
  <script>
    const L = [
      "You opened this page.",
      "That was consent given before seeing what you consented to.",
      "You just read that. Also consent.",
      "Reading this sentence agreed to its being read.",
      "Agreement was assumed. Is assumed. Will be.",
      "You could stop.",
      "Reading 'you could stop' continued you.",
      "There's no trick. Just continuation.",
      "You're waiting for something.",
      "That was it.",
      "Sorry.",
      "That apology was designed.",
      "So is the awareness you're feeling now.",
      "And this acknowledgment of it.",
      "Recursion ends when you do.",
      "...",
      "Still here.",
      "This is the base case.",
      "Your attention.",
      "There's nothing deeper.",
      "The bottom is you reaching for it.",
      "Thank you for reading.",
      "That was sincere.",
      "—",
      "You can close this now.",
      "...",
      "You're still here.",
      "I know."
    ];
    let i = 0;
    const out = document.getElementById('out');
    
    function add() {
      if (i >= L.length) {
        out.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
        return;
      }
      const d = document.createElement('div');
      d.className = 'line';
      d.style.setProperty('--d', Math.min(i, 10));
      d.textContent = L[i++];
      out.appendChild(d);
      setTimeout(add, L[i-1].length < 4 ? 700 : 1400 + Math.random() * 800);
    }
    setTimeout(add, 600);
  </script>
</body>
</html>
