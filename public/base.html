<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequential Base Encoder & Decoder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            margin-top: 15px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-encode {
            background-color: #3498db;
            color: white;
        }
        .btn-encode:hover { background-color: #2980b9; }
        
        .btn-decode {
            background-color: #2ecc71;
            color: white;
        }
        .btn-decode:hover { background-color: #27ae60; }

        .btn-copy {
            background-color: #9b59b6;
            color: white;
            margin-top: 10px;
        }
        .btn-copy:hover { background-color: #8e44ad; }
        
        .toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 10px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <h2>Sequential Base Encoder/Decoder</h2>
    
    <div class="container">
        <label for="inputText">Input Text (Plain text or Encoded text):</label>
        <textarea id="inputText" placeholder="Type your sentence here..."></textarea>

        <div class="button-group">
            <button class="btn-encode" onclick="processText('encode')">Encode Text</button>
            <button class="btn-decode" onclick="processText('decode')">Decode Text</button>
        </div>

        <label for="outputText">Output:</label>
        <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
        
        <button class="btn-copy" onclick="copyToClipboard()">Copy Output</button>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        // The repeating bases as requested
        const bases = [26, 27, 28, 29];

        function processText(mode) {
            const input = document.getElementById('inputText').value;
            const outputEl = document.getElementById('outputText');
            
            if (!input) {
                outputEl.value = "";
                return;
            }

            if (mode === 'encode') {
                let encodedResult = [];
                for (let i = 0; i < input.length; i++) {
                    // Get ASCII value of the character
                    let charCode = input.charCodeAt(i);
                    // Determine which base to use
                    let currentBase = bases[i % bases.length];
                    // Convert to that base and push to array
                    encodedResult.push(charCode.toString(currentBase));
                }
                // Join with a space so decoding is possible
                outputEl.value = encodedResult.join(' ');
            } 
            else if (mode === 'decode') {
                // Split the input by spaces to get individual encoded characters
                let tokens = input.trim().split(/\s+/);
                let decodedResult = "";
                
                for (let i = 0; i < tokens.length; i++) {
                    let currentBase = bases[i % bases.length];
                    // Parse the character back from the base to base-10 ASCII
                    let charCode = parseInt(tokens[i], currentBase);
                    
                    if (isNaN(charCode)) {
                        decodedResult += ""; // Indication of an invalid character/decode error
                    } else {
                        // Convert ASCII code back to string
                        decodedResult += String.fromCharCode(charCode);
                    }
                }
                outputEl.value = decodedResult;
            }
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) return;

            // Modern clipboard API
            navigator.clipboard.writeText(outputText).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                // Fallback for older browsers
                const textArea = document.getElementById('outputText');
                textArea.select();
                document.execCommand('copy');
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "toast show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>

</body>
</html>
